title: Dental Nurse Training
description: Blended-learning certificate in fluoride varnish application designed to support the GDC Scope of Practice for dental nurses.
baseurl: "/Fluoride"
url: "https://dentalnurse.github.io"

permalink: /blog/:title/
future: false
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"

# firestore.rules is kept here for version-controlled review only, not for
# the Firebase CLI (no firebase.json/CI deploy step exists) and not meant
# to be published on the live site
exclude:
  - firestore.rules
