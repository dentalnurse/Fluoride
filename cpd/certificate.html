<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/gate.js?v=20261006c"></script>
  <meta name="robots" content="noindex, nofollow"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CPD Certificate - Dental Nurse Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Nunito Sans','Segoe UI',system-ui,sans-serif; background:#F8FAFA; color:#1A1A1A; }
    .screen-bar { background:#005A5F; color:white; padding:0.85rem 2rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .screen-bar a { color:rgba(255,255,255,0.8); text-decoration:none; font-size:0.88rem; }
    .print-btn { background:white; color:#005A5F; border:none; border-radius:100px; padding:0.5rem 1.4rem; font-weight:700; font-size:0.88rem; cursor:pointer; font-family:inherit; }
    .cert-page { max-width:860px; margin:2rem auto 0; background:white; padding:3rem 3.5rem; border:6px solid #00747A; border-radius:8px; box-shadow:0 8px 40px rgba(0,0,0,0.12); position:relative; }
    .cert-page::before { content:''; position:absolute; inset:10px; border:1.5px solid #D8EBEC; border-radius:4px; pointer-events:none; }
    .cert-back { margin:1.5rem auto 3rem; }
    .cert-logo { text-align:center; margin-bottom:1rem; }
    .cert-logo img { height:64px; display:inline-block; }
    .cert-type { text-align:center; font-size:0.72rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:#6B6B6B; margin-bottom:0.4rem; }
    .cert-title { text-align:center; font-size:1.9rem; font-weight:800; color:#005A5F; margin-bottom:0.25rem; }
    .cert-provider { text-align:center; font-size:0.85rem; color:#6B6B6B; margin-bottom:1.5rem; font-weight:600; }
    .cert-certifies { text-align:center; font-size:0.95rem; color:#3D3D3D; margin-bottom:0.4rem; }
    .cert-name { text-align:center; font-size:2.2rem; font-weight:800; color:#005A5F; margin-bottom:0.3rem; line-height:1.2; }
    .cert-gdc { text-align:center; font-size:0.88rem; color:#6B6B6B; margin-bottom:0.6rem; }
    .cert-course { text-align:center; font-size:1.3rem; font-weight:700; margin-bottom:1.75rem; }
    .cpd-summary { background:#E8F4F5; border:2px solid #00747A; border-radius:8px; padding:1.1rem 1.5rem; display:flex; gap:1.25rem; margin-bottom:1.5rem; }
    .cpd-col { flex:1; }
    .cpd-col + .cpd-col { border-left:1px solid #B2D8DA; padding-left:1.25rem; }
    .cpd-label { font-size:0.68rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#007A80; margin-bottom:0.3rem; }
    .cpd-value { font-size:1.05rem; font-weight:800; color:#005A5F; line-height:1.35; }
    .sig-section { display:flex; align-items:flex-end; justify-content:space-between; gap:2rem; margin-top:1.25rem; padding-top:1.25rem; border-top:1px solid #D8EBEC; }
    .sig-block img { height:48px; display:block; margin-bottom:0.2rem; }
    .sig-name { font-size:0.88rem; font-weight:700; }
    .sig-role, .small { font-size:0.78rem; color:#6B6B6B; }
    .right { text-align:right; }
    h3 { font-size:0.72rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:#6B6B6B; margin:1.25rem 0 0.5rem; }
    h3:first-child { margin-top:0; }
    p, li { font-size:0.88rem; line-height:1.6; color:#3D3D3D; }
    ul { padding-left:1.2rem; }
    .outcome { display:flex; gap:0.6rem; margin-bottom:0.4rem; }
    .outcome b { color:#00747A; }
    .refl-q { font-weight:700; color:#1A1A1A; margin-top:0.6rem; }
    .qa { background:#F0FAFB; border-left:4px solid #00747A; padding:0.75rem 1rem; margin-top:1.25rem; }
    .msg { max-width:560px; margin:4rem auto; text-align:center; padding:2rem; }
    @media (max-width:700px) { .cert-page { padding:2rem 1.25rem; margin:1rem; } .cpd-summary { flex-direction:column; } .cpd-col + .cpd-col { border-left:none; padding-left:0; border-top:1px solid #B2D8DA; padding-top:0.75rem; } .cert-name { font-size:1.6rem; } }
    @media print {
      body { background:white; }
      .screen-bar { display:none; }
      .cert-page { box-shadow:none; margin:0 auto; page-break-after:always; }
      .cert-back { page-break-after:auto; }
      @page { size:A4; margin:10mm; }
    }
  </style>
</head>
<body>
  <div class="screen-bar"><a href="dashboard.html" id="backLink">← Back to My CPD</a><button class="print-btn" onclick="window.print()">🖨 Print / save as PDF</button></div>
  <div id="out"><div class="msg">Loading certificate...</div></div>

  <script src="js/config.js?v=20261006c"></script>
  <script src="js/ui.js?v=20261006c"></script>
  <script src="js/demo-course.js?v=20261006c"></script>
  <script type="module">
    import * as D from './js/data.js?v=20261006c';
    document.getElementById('backLink').href = D.link('dashboard.html');
    if (D.PREVIEW) document.querySelector('.screen-bar').insertAdjacentHTML('afterend', '<div style="background:#FFF3CD;color:#92400E;text-align:center;padding:0.6rem 1rem;font-size:0.9rem"><strong>Preview mode:</strong> this is a sample certificate.</div>');
    const out = document.getElementById('out');
    const fail = (m) => { out.innerHTML = '<div class="msg"><p>' + esc(m) + '</p></div>'; };

    const me = await D.getSessionUser();
    if (!me) { location.href = D.link('login.html?next=dashboard.html'); throw 0; }
    const slug = qs('c');
    // Admins can open any learner's certificate with &u=<learner id>
    const uid = qs('u') && me.isAdmin ? qs('u') : me.uid;
    let learner = me;
    if (uid !== me.uid) learner = (await D.listLearners()).find(l => l.uid === uid) || {};
    const [course, prog] = await Promise.all([D.getCourse(slug), D.getProgress(uid, slug)]);
    if (!prog || !prog.completedAt) { fail('This certificate is not available yet. Complete every step of the course first.'); throw 0; }
    const c = course || { title: prog.title, hours: prog.hours, outcomes: [], objectives: [] };
    document.title = 'CPD Certificate - ' + c.title;
    const outcomes = c.outcomes || [];
    const ver = verifiableFor(course || { cpdType: prog.cpdType }, learner);

    out.innerHTML = '<div class="cert-page">'
      + '<div class="cert-logo"><img src="' + LOGO_URL + '" alt="Dental Nurse Training" onerror="this.style.display=\'none\'"/></div>'
      + '<div class="cert-type">' + (ver ? 'Certificate of verifiable CPD' : 'Certificate of CPD') + '</div>'
      + '<div class="cert-title">' + esc(c.title) + '</div>'
      + '<div class="cert-provider">Provided by ' + esc(PROVIDER_NAME) + '</div>'
      + '<div class="cert-certifies">This is to certify that</div>'
      + '<div class="cert-name">' + esc(learner.name || '') + '</div>'
      + (ver || learner.gdc ? '<div class="cert-gdc">GDC registration number: ' + esc(learner.gdc || 'not given') + '</div>' : '<div style="height:0.6rem"></div>')
      + '<div class="cert-certifies">has successfully completed the above online CPD course, including the end of course assessment, reflection and feedback.</div>'
      + '<div style="height:1.25rem"></div>'
      + '<div class="cpd-summary">'
      + '<div class="cpd-col"><div class="cpd-label">' + (ver ? 'Verifiable CPD' : 'CPD hours') + '</div><div class="cpd-value">' + esc(c.hours) + ' hour' + (Number(c.hours) === 1 ? '' : 's') + '</div></div>'
      + (ver ? '<div class="cpd-col"><div class="cpd-label">GDC development outcomes</div><div class="cpd-value">' + esc(outcomes.join(', ') || '-') + '</div></div>' : '<div class="cpd-col"><div class="cpd-label">Activity</div><div class="cpd-value">Online course with assessment</div></div>')
      + '<div class="cpd-col"><div class="cpd-label">Date completed</div><div class="cpd-value">' + fmtDate(prog.completedAt) + '</div></div>'
      + '</div>'
      + '<div class="sig-section"><div class="sig-block"><img src="../images/signature.png" alt="" onerror="this.style.display=\'none\'"/><div class="sig-name">' + esc(CERT_SIGNATORY_NAME) + '</div><div class="sig-role">' + esc(CERT_SIGNATORY_ROLE) + '</div></div>'
      + '<div class="right"><div class="small">Certificate number</div><div class="sig-name">' + esc(prog.certNo || '') + '</div><div class="small" style="margin-top:0.3rem">Quiz score: ' + esc((prog.quiz && prog.quiz.best) || '') + '%</div></div></div>'
      + '</div>'

      + '<div class="cert-page cert-back">'
      + '<h3>Educational aims</h3><p>' + esc(c.aims || '') + '</p>'
      + '<h3>Objectives</h3><ul>' + (c.objectives || []).map(o => '<li>' + esc(o) + '</li>').join('') + '</ul>'
      + (ver ? '<h3>Anticipated outcomes (GDC development outcomes)</h3>' : '') + (ver ? outcomes : []).map(o => '<div class="outcome"><b>' + esc(o) + '</b><p>' + esc(GDC_OUTCOMES[o] || '') + '</p></div>').join('')
      + (prog.reflection ? '<h3>Learner reflection</h3>' + (prog.reflection.questions || []).map((q, i) => '<p class="refl-q">' + esc(q) + '</p><p>' + esc((prog.reflection.answers || [])[i] || '') + '</p>').join('') : '')
      + (ver ? '<div class="qa"><p><strong>Quality assurance.</strong> This activity has been planned and quality assured by ' + esc(PROVIDER_NAME) + ', and learners are given the opportunity to give feedback. It includes an assessment of learning and is offered as verifiable CPD in line with the General Dental Council enhanced CPD scheme. Please keep this certificate as evidence for your CPD record for at least five years after the end of your CPD cycle, and log the hours against your personal development plan.</p></div>'
        : '<div class="qa"><p><strong>About this certificate.</strong> This CPD activity has been planned and quality assured by ' + esc(PROVIDER_NAME) + ', includes an assessment of learning, and learners are given the opportunity to give feedback. Please keep this certificate as evidence for your CPD record. ' + (cpdType(course || { cpdType: prog.cpdType }) === 'both' ? 'GDC-registered dental professionals can receive a verifiable CPD certificate for this course by adding their GDC number to their account.' : 'This activity is not verifiable CPD under the General Dental Council scheme.') + '</p></div>')
      + (c.certNote ? '<p class="small" style="margin-top:0.75rem">' + esc(c.certNote) + '</p>' : '')
      + '<p class="small" style="margin-top:1rem">' + esc(PROVIDER_NAME) + ' · dentalnurse.training · Certificate ' + esc(prog.certNo || '') + '</p>'
      + '</div>';
  </script>
</body>
</html>
