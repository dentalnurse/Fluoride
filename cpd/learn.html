<html lang="en">
<head>
  <script src="js/gate.js?v=20261029a"></script>

  <meta charset="UTF-8"/>

  <title>Course - Dental Nurse Training CPD Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

    @media (max-width:960px) { .mobile-menu-btn { display:inline-flex; } }

<body>
  <div id="navHolder"></div>
  <div class="dash-layout">
    <aside class="dash-sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="backdrop"></div>
    <main class="dash-main">
      <button class="btn btn-outline btn-sm mobile-menu-btn" id="menuBtn">☰ Course menu</button>
      <div id="adminNote"></div>
      <div id="main"><p style="color:var(--ink-light)">Loading course...</p></div>
    </main>
  </div>

  <script src="js/config.js?v=20261029a"></script>
  <script src="js/ui.js?v=20261029a"></script>
  <script src="js/render.js?v=20261029a"></script>
  <script src="js/demo-course.js?v=20261029a"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>if (typeof emailjs !== 'undefined') emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey });</script>
  <script type="module">
    import * as D from './js/data.js?v=20261029a';
    const user = await D.mountChrome();
    const slug = qs('c');
    const main = document.getElementById('main');
    const sidebar = document.getElementById('sidebar');

    if (!user) { location.href = D.link('login.html?next=' + encodeURIComponent('learn.html?c=' + slug)); throw 0; }
    const course = await D.getCourse(slug);
    const access = await D.getAccess(user.uid);
    const hasAccess = !!access[slug];
    const adminView = !hasAccess && user.isAdmin;
    if (!course || (!hasAccess && !adminView)) { location.href = D.link('course.html?c=' + encodeURIComponent(slug || '')); throw 0; }
    const content = await D.getCourseContent(slug) || { lessons: [], quiz: { passMark: 80, questions: [] }, reflection: [] };
    const lessons = content.lessons || [];
    const quiz = content.quiz || { passMark: 80, questions: [] };
    let prog = (hasAccess ? await D.getProgress(user.uid, slug) : null) || { lessonsDone: [] };
    prog.lessonsDone = prog.lessonsDone || [];
    document.title = course.title + ' - CPD Hub';

    // Supervised practice (logbook, supervisor, case study) if the course has it
    const P = practicalOf(course);
    const SUP = (P && P.supervisorTitle) || 'supervisor';
    const NOUN = caseNoun(P);
    const CATS = caseCats(P);
    const ASSIGN = assignmentsOf(P);
    let supervisions = [], cases = [], marks = {};
    async function loadPractical() {
      if (!P || adminView) return;
      try {
        supervisions = (await D.listSupervisionsForLearner(user.uid)).filter(s => s.slug === slug).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        cases = (await D.listCasesForLearner(user.uid)).filter(c => c.slug === slug).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
        marks = {};
        for (const a of ASSIGN) marks[a.id] = await D.getMark(user.uid, markKey(slug, a));
      } catch (e) { console.error(e); toast('Could not load your logbook. Please refresh the page.', 'error'); }
    }
    await loadPractical();
    const activeSupervisions = () => supervisions.filter(s => s.status !== 'rejected');
    const approvedSupervisions = () => supervisions.filter(s => s.status === 'approved');
    const approvedSupervision = () => approvedSupervisions()[0] || null;
    const satisfactoryCases = () => cases.filter(isSatCase);
    const lbStatus = () => logbookStatus(P, cases, supervisions);
    const logbookComplete = () => !!P && lbStatus().complete;
    // Written work: stored on the learner's progress, marked by an admin
    const subOf = a => a.legacy ? (prog.caseStudy || null) : ((prog.assignments || {})[a.id] || null);
    const valuesOf = (a, sub) => !sub ? {} : a.legacy ? { text: sub.text } : (sub.values || {});
    const markOf = a => { const m = marks[a.id], sub = subOf(a); return m && sub && m.forVersion === sub.version ? m : null; };
    const assignDone = a => { const sub = subOf(a); if (!sub) return false; if (a.marked === false) return true; const m = markOf(a); return !!(m && m.status === 'satisfactory'); };

    // Completion window
    const acc = access[slug] || {};
    const expired = !adminView && acc.expiresAt && new Date(acc.expiresAt) < new Date() && !prog.completedAt;

    if (adminView) document.getElementById('adminNote').innerHTML = '<div class="callout callout-warn" style="margin-top:0"><div class="callout-label">Admin view</div><p>You are viewing this course as an admin. Everything is unlocked and nothing you do here is saved.</p></div>';

    async function save(data) {
      Object.assign(prog, data);
      if (adminView) return;
      prog.percent = percentDone();
      try { await D.saveProgress(user.uid, slug, { ...data, percent: prog.percent, title: course.title, hours: course.hours, cpdType: course.cpdType || 'verifiable' }); }
      catch (e) { console.error(e); toast('Could not save your progress. Please check your connection.', 'error'); throw e; }
    }

    // ── Steps and locking ────────────────────────────────────────────────
    const lessonDone = id => prog.lessonsDone.includes(id);
    const allLessonsDone = () => lessons.every(l => lessonDone(l.id));
    const hasReflection = (content.reflection || []).length > 0;
    // Courses with only module quizzes have no separate final quiz step
    const hasFinalQuiz = (quiz.questions || []).length > 0;
    const quizPassed = () => hasFinalQuiz ? !!(prog.quiz && prog.quiz.passed) : allLessonsDone();
    const aStep = a => ['a:' + a.id, a.icon || '📝', a.title];
    const steps = [['intro', '🏠', 'Course overview'], ...lessons.map((l, i) => ['lesson:' + l.id, String(i + 1), l.title]),
      ...(hasFinalQuiz ? [['quiz', '✅', lessons.some(l => l.quiz && (l.quiz.questions || []).length) ? 'Final assessment' : 'Quiz']] : []),
      ...ASSIGN.filter(a => a.stage === 'theory').map(aStep),
      ...(P ? [['supervisor', '🤝', 'Your ' + SUP], ['logbook', '📒', 'Supervised logbook']] : []),
      ...ASSIGN.filter(a => a.stage === 'practical').map(aStep),
      ...ASSIGN.filter(a => a.stage === 'end').map(aStep),
      ...ASSIGN.filter(a => a.stage === 'final').map(aStep),
      ...(hasReflection ? [['reflection', '🪞', 'Reflection']] : []),
      ['feedback', '💬', 'Feedback'], ['done', '🏅', 'Certificate']];
    const assignOf = step => ASSIGN.find(a => 'a:' + a.id === step);
    function isDone(step) {
      if (step.startsWith('lesson:')) return lessonDone(step.slice(7));
      if (step.startsWith('a:')) return assignDone(assignOf(step));
      return { quiz: quizPassed(), supervisor: !!approvedSupervision(), logbook: logbookComplete(),
               reflection: !!prog.reflection, feedback: !!prog.feedback, done: !!prog.completedAt, intro: false }[step];
    }
    // Work that must be handed in before the logbook opens (e.g. a starting reflection)
    const preLogbookDone = () => ASSIGN.filter(a => a.requiredForLogbook).every(a => !!subOf(a));
    function unlocked(step) {
      if (adminView) return true;
      if (step === 'intro') return true;
      if (expired && step !== 'done') return false;
      // The supervisor can be invited at any time, as approval can take a while
      if (step === 'supervisor') return true;
      if (step === 'logbook') return quizPassed() && !!approvedSupervision() && preLogbookDone();
      const a = assignOf(step);
      if (a && (a.stage === 'theory' || a.stage === 'practical')) return quizPassed();
      if (a && a.stage === 'end') return quizPassed() && logbookComplete();
      // Everything else unlocks in order
      const i = steps.findIndex(s => s[0] === step);
      return steps.slice(1, i).every(([id]) => isDone(id));
    }
    const progressSteps = () => steps.filter(([id]) => id !== 'intro' && id !== 'done');
    const percentDone = () => Math.round(progressSteps().filter(([id]) => isDone(id)).length / Math.max(1, progressSteps().length) * 100);

    let current = 'intro';
    function drawSidebar() {
      const pct = percentDone();
      sidebar.innerHTML = '<div style="padding:0 0.5rem 0.75rem;color:var(--white)"><div style="font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;opacity:0.5">CPD course</div><div style="font-weight:700;line-height:1.3;margin-top:0.2rem">' + esc(course.title) + '</div>'
        + '<div class="progress-bar-wrap" style="background:rgba(255,255,255,0.15)"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div><div style="font-size:0.75rem;opacity:0.6">' + pct + '% complete</div></div>'
        + '<div class="sidebar-section-title">Lessons</div>'
        + steps.map(([id, icon, label], i) => {
            const lock = !unlocked(id), done = isDone(id);
            const section = id === 'quiz' ? '<div class="sidebar-section-title">Finish</div>' : '';
            return section + '<button class="sidebar-item' + (id === current ? ' active' : '') + (lock ? ' locked' : '') + '" data-step="' + esc(id) + '"><span class="si-icon">' + esc(icon) + '</span><span>' + esc(label) + '</span>'
              + (done ? '<span class="si-badge badge-done">✓</span>' : lock ? '<span class="si-badge badge-lock">🔒</span>' : '') + '</button>';
          }).join('')
        + '<div style="margin-top:1.25rem;padding:0 0.5rem"><a href="' + D.link('dashboard.html') + '" style="color:rgba(255,255,255,0.6);font-size:0.82rem">← Back to My CPD</a></div>';
      sidebar.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { if (unlocked(b.dataset.step)) go(b.dataset.step); else toast('Finish the earlier steps first to unlock this.'); });
    }

    function go(step) {
      current = step;
      sidebar.classList.remove('mobile-open'); document.getElementById('backdrop').classList.remove('visible');
      drawSidebar();
      window.scrollTo(0, 0);
      if (step === 'intro') return showIntro();
      if (step.startsWith('lesson:')) return showLesson(lessons.findIndex(l => 'lesson:' + l.id === step));
      if (step.startsWith('a:')) return showAssignment(assignOf(step));
      ({ quiz: showQuiz, supervisor: showSupervisor, logbook: showLogbook, reflection: showReflection, feedback: showFeedback, done: showDone })[step]();
    }
    function nextStep() {
      const i = steps.findIndex(s => s[0] === current);
      return steps[i + 1] ? steps[i + 1][0] : null;
    }
    function firstOpenStep() {
      for (const [id] of steps) if (id !== 'intro' && unlocked(id) && !isDone(id)) return id;
      return prog.completedAt ? 'done' : 'intro';
    }

    // ── Overview ─────────────────────────────────────────────────────────
    function showIntro() {
      const started = prog.lessonsDone.length || prog.quiz;
      const c = { ...course, lessonTitles: lessons.map(l => l.title), questionCount: (quiz.questions || []).length, passMark: quiz.passMark || 80, quizPerAttempt: Number(quiz.perAttempt) || 0,
        lessonQuizFlags: lessons.map(l => !!lessonQuiz(l)), lessonQuizCount: lessons.filter(lessonQuiz).length, hasReflection };
      const pct = percentDone();
      const label = prog.completedAt ? 'View my certificate' : started ? 'Continue course →' : 'Start course →';
      main.innerHTML = '<div class="ov-hero"><div class="ov-icon">' + courseVisual(c) + '</div><div style="flex:1;min-width:0">'
          + '<div class="ch-tags"><span class="ch-tag">' + esc(course.category || 'Course') + '</span><span class="ch-tag">' + esc({ verifiable: 'Verifiable CPD', both: 'GDC verifiable CPD', general: 'CPD' }[cpdType(c)]) + '</span></div>'
          + '<h1>' + esc(course.title) + '</h1><div class="ch-chips">' + courseChips(c) + '</div>'
          + (started && !prog.completedAt ? '<div style="margin-top:1rem;max-width:420px"><div class="progress-bar-wrap" style="background:rgba(255,255,255,0.2)"><div class="progress-bar-fill" style="width:' + pct + '%;background:var(--white)"></div></div><div style="color:rgba(255,255,255,0.8);font-size:0.8rem">' + pct + '% complete</div></div>' : '')
          + '<button class="btn btn-white btn-lg" id="startBtn" style="margin-top:1.1rem">' + label + '</button></div></div>'
        + deadlineHtml() + (course.certNote ? '<div class="callout callout-warn" style="margin-top:0"><div class="callout-label">Please note</div><p>' + esc(course.certNote) + '</p></div>' : '')
        + '<div class="cd-section"><h2 style="font-size:1.25rem;margin-bottom:0.8rem">What you\'ll learn</h2>' + objectivesGrid(c) + '</div>'
        + '<div class="cd-section"><h2 style="font-size:1.25rem;margin-bottom:0.8rem">Course content</h2>' + lessonList(c) + '</div>'
        + '<div class="cd-section"><h2 style="font-size:1.25rem;margin-bottom:0.8rem">About this course</h2><div class="cd-card"><p>' + esc(course.aims || '') + '</p>'
          + (usesGdc(c) ? '<p style="font-weight:700;color:var(--ink);margin:1rem 0 0.25rem">GDC development outcomes</p>' + outcomesBadges(c) : '')
          + '<p style="font-size:0.84rem;color:var(--ink-light);margin-top:1rem">' + esc(audienceText(c)) + '</p></div></div>';
      document.getElementById('startBtn').onclick = () => go(firstOpenStep() === 'intro' ? steps[1][0] : firstOpenStep());
    }

    // ── Lessons ──────────────────────────────────────────────────────────
    // A lesson's quiz counts only if it has questions.
    const lessonQuiz = l => (l.quiz && (l.quiz.questions || []).length) ? l.quiz : null;
    const hasLessonQuizzes = lessons.some(lessonQuiz);

    // Split a lesson's blocks into pages at each "page break" block.
    function lessonPages(l) {
      const pages = [[]];
      (l.blocks || []).forEach(b => { if (b.type === 'pagebreak') { if (pages[pages.length - 1].length) pages.push([]); } else pages[pages.length - 1].push(b); });
      return pages;
    }

    function showLesson(i, page) {
      const l = lessons[i];
      const pages = lessonPages(l);
      page = Math.max(0, Math.min(page || 0, pages.length - 1));
      const last = page === pages.length - 1;
      const lq = lessonQuiz(l);
      const done = lessonDone(l.id);
      main.innerHTML = '<div class="dash-header"><span class="mc-mod">Lesson ' + (i + 1) + ' of ' + lessons.length + '</span><h1>' + esc(l.title) + '</h1>'
          + (pages.length > 1 ? '<div style="display:flex;align-items:center;gap:0.75rem;margin-top:0.6rem;max-width:420px"><div class="progress-bar-wrap" style="flex:1;margin:0"><div class="progress-bar-fill" style="width:' + Math.round((page + 1) / pages.length * 100) + '%"></div></div><span style="font-size:0.8rem;color:var(--ink-light);white-space:nowrap">Page ' + (page + 1) + ' of ' + pages.length + '</span></div>' : '')
        + '</div><div class="content-card" id="lessonBody"></div>'
        + '<div class="lesson-nav"><button class="btn btn-outline" id="prevBtn">← Back</button><div style="text-align:right"><button class="btn btn-primary" id="doneBtn"></button>'
        + (last && lq && done ? '<div style="margin-top:0.5rem"><a href="#" id="retakeLq" class="submission-link">Retake the module quiz</a></div>' : '')
        + '<div id="todo" style="font-size:0.8rem;color:var(--ink-light);margin-top:0.4rem"></div></div></div>';
      const body = document.getElementById('lessonBody');
      const blocks = pages[page];
      let needed = blocks.filter(b => BLOCK_TYPES[b.type] && BLOCK_TYPES[b.type].interactive).length;
      const btn = document.getElementById('doneBtn');
      const update = () => {
        const ready = done || adminView || needed <= 0;
        btn.disabled = !ready;
        btn.textContent = !last ? 'Next page →' : done ? 'Next →' : lq ? 'Take the module quiz →' : 'Complete lesson and continue →';
        document.getElementById('todo').textContent = ready ? '' : 'Try the ' + needed + ' remaining activit' + (needed === 1 ? 'y' : 'ies') + ' on this page to continue.';
      };
      blocks.forEach(b => body.appendChild(renderBlock(b, () => { needed--; update(); })));
      if (!blocks.length) body.innerHTML = '<p style="color:var(--ink-light)">This lesson has no content yet.</p>';
      update();
      window.scrollTo(0, 0);
      document.getElementById('prevBtn').onclick = () => {
        if (page > 0) return showLesson(i, page - 1);
        if (i === 0) return go('intro');
        go('lesson:' + lessons[i - 1].id);
      };
      const rq = document.getElementById('retakeLq');
      if (rq) rq.onclick = (e) => { e.preventDefault(); showLessonQuiz(i); };
      btn.onclick = async () => {
        if (!last) return showLesson(i, page + 1);
        if (!done && lq) return showLessonQuiz(i);
        if (!done) { try { await save({ lessonsDone: [...prog.lessonsDone, l.id] }); } catch (e) { return; } }
        go(nextStep());
      };
    }

    function showLessonQuiz(i) {
      const l = lessons[i], lq = lessonQuiz(l);
      const done = lessonDone(l.id);
      runQuiz({
        heading: 'Module quiz: ' + l.title, quiz: lq,
        record: async (score, passed) => {
          const all = { ...(prog.lessonQuiz || {}) };
          const prev = all[l.id] || {};
          all[l.id] = { best: Math.max(prev.best || 0, score), last: score, attempts: (prev.attempts || 0) + 1, passed: prev.passed || passed };
          const data = { lessonQuiz: all };
          if (passed && !done) data.lessonsDone = [...prog.lessonsDone, l.id];
          await save(data);
        },
        nextLabel: i < lessons.length - 1 ? 'Continue to the next lesson →' : (hasFinalQuiz ? 'Continue to the final assessment →' : 'Continue →'),
        onNext: () => go(nextStep()),
        onRetry: () => showLessonQuiz(i),
        onBack: () => showLesson(i, lessonPages(l).length - 1),
      });
    }

    // ── Final quiz ───────────────────────────────────────────────────────
    function showQuiz() {
      const title = hasLessonQuizzes ? 'Final assessment' : 'End of course quiz';
      if (prog.quiz && prog.quiz.passed && !main.dataset.retake) {
        main.innerHTML = '<div class="content-card quiz-result"><div class="quiz-score quiz-pass">' + prog.quiz.best + '%</div><div class="quiz-score-sub">You passed the ' + title.toLowerCase() + '.</div><button class="btn btn-primary" id="nx">Continue →</button></div>';
        document.getElementById('nx').onclick = () => go(nextStep());
        return;
      }
      runQuiz({
        heading: title, quiz, lastIds: (prog.quiz && prog.quiz.lastIds) || [],
        record: async (score, passed, ids) => {
          const prev = prog.quiz || {};
          await save({ quiz: { best: Math.max(prev.best || 0, score), last: score, attempts: (prev.attempts || 0) + 1, passed: prev.passed || passed, passedAt: prev.passedAt || (passed ? new Date().toISOString() : null), lastIds: ids } });
        },
        nextLabel: 'Continue →',
        onNext: () => go(nextStep()),
        onRetry: () => { main.dataset.retake = '1'; showQuiz(); delete main.dataset.retake; },
      });
    }

    // Shared quiz: shuffles questions and options, and if "questions per
    // attempt" is set, asks a random selection from the bank each time.
    function runQuiz(o) {
      const pass = Number(o.quiz.passMark || 80);
      const bank = o.quiz.questions || [];
      const per = Number(o.quiz.perAttempt) > 0 ? Math.min(Number(o.quiz.perAttempt), bank.length) : bank.length;
      if (!bank.length) { main.innerHTML = '<div class="content-card"><p>There are no quiz questions yet.</p></div>'; return; }
      // Choose questions: at least "minPerTag" from each module tag, then fill
      // up at random, preferring questions not asked in the learner's last attempt.
      const seen = new Set((o.lastIds || []).map(String));
      const freshFirst = ids => [...shuffle(ids.filter(i => !seen.has(String(i)))), ...shuffle(ids.filter(i => seen.has(String(i))))];
      let picked = [];
      const minPer = Number(o.quiz.minPerTag) || 0;
      if (minPer && per < bank.length) {
        const tags = [...new Set(bank.map(q => q.tag).filter(t => t !== undefined && t !== ''))];
        tags.forEach(t => { picked.push(...freshFirst(bank.map((q, i) => i).filter(i => String(bank[i].tag) === String(t))).slice(0, minPer)); });
        picked = picked.slice(0, per);
      }
      picked.push(...freshFirst(bank.map((q, i) => i).filter(i => !picked.includes(i))).slice(0, per - picked.length));
      const paperIds = picked;
      const paper = shuffle(picked).map(qi => {
        const q = bank[qi];
        const order = shuffle(q.options.map((x, oi) => oi));
        return { q, order, correct: order.indexOf(Number(q.answer) - 1) };
      });
      const limit = Number(o.quiz.timeLimit) || 0;
      const answers = {};
      main.innerHTML = '<div class="dash-header"><h1>' + esc(o.heading) + '</h1><p>' + paper.length + ' questions' + (per < bank.length ? ' chosen at random' : '') + ' · pass mark ' + pass + '%' + (limit ? ' · ' + limit + ' minutes' : '') + '. Answer every question, then submit.</p>'
          + (limit ? '<div id="qTimer" style="position:sticky;top:calc(var(--nav-h) + 0.5rem);z-index:5;display:inline-block;margin-top:0.6rem;background:var(--teal-dark);color:var(--white);border-radius:100px;padding:0.35rem 1rem;font-weight:700;font-size:0.9rem"></div>' : '')
          + (o.onBack ? '<p style="margin-top:0.4rem"><a href="#" id="qBack" class="submission-link">← Back to the lesson</a></p>' : '') + '</div>'
        + paper.map((p, i) => '<div class="content-card quiz-wrap" style="max-width:none"><div class="quiz-progress"><span>Question ' + (i + 1) + ' of ' + paper.length + '</span></div><div class="quiz-q">' + esc(p.q.q) + '</div><div class="quiz-options" data-q="' + i + '">'
          + p.order.map((oi, k) => '<div class="quiz-option" data-k="' + k + '"><span class="quiz-option-key">' + 'ABCDEFGH'[k] + '</span><span>' + esc(p.q.options[oi]) + '</span></div>').join('') + '</div><div class="fb"></div></div>').join('')
        + '<div id="quizErr" class="form-error" style="display:none;margin-bottom:0.75rem"></div><button class="btn btn-primary btn-lg" id="submitQuiz">Submit answers</button>';
      window.scrollTo(0, 0);
      const qb = document.getElementById('qBack');
      if (qb) qb.onclick = (e) => { e.preventDefault(); o.onBack(); };
      main.querySelectorAll('.quiz-options').forEach(box => box.querySelectorAll('.quiz-option').forEach(opt => opt.onclick = () => {
        if (box.dataset.locked) return;
        box.querySelectorAll('.quiz-option').forEach(x => x.classList.remove('selected'));
        opt.classList.add('selected'); answers[box.dataset.q] = Number(opt.dataset.k);
      }));
      let timer = null, finished = false;
      if (limit) {
        const end = Date.now() + limit * 60000;
        const tick = () => {
          const el = document.getElementById('qTimer');
          if (!el || finished) { clearInterval(timer); return; }
          const left = Math.max(0, Math.round((end - Date.now()) / 1000));
          el.textContent = '⏱ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + ' left';
          if (left <= 60) el.style.background = 'var(--warn)';
          if (left === 0) { clearInterval(timer); toast('Time is up. Your answers have been submitted.'); submit(true); }
        };
        tick(); timer = setInterval(tick, 1000);
      }
      const submit = async (force) => {
        if (finished) return;
        if (!force && Object.keys(answers).length < paper.length) { const e = document.getElementById('quizErr'); e.textContent = 'Please answer every question before submitting.'; e.style.display = 'block'; return; }
        finished = true; clearInterval(timer);
        const qt = document.getElementById('qTimer'); if (qt) qt.remove();
        let right = 0;
        paper.forEach((p, i) => {
          const box = main.querySelector('.quiz-options[data-q="' + i + '"]'); box.dataset.locked = '1';
          const ok = answers[i] === p.correct; if (ok) right++;
          box.querySelectorAll('.quiz-option').forEach((x, k) => { x.classList.add('disabled'); if (k === p.correct) x.classList.add('correct'); else if (k === answers[i]) x.classList.add('wrong'); });
          box.nextElementSibling.innerHTML = '<div class="act-feedback ' + (ok ? 'good' : 'bad') + '"><strong>' + (ok ? 'Correct.' : 'Incorrect.') + '</strong>' + (p.q.explain ? ' ' + esc(p.q.explain) : '') + '</div>';
        });
        const score = Math.round(right / paper.length * 100), passed = score >= pass;
        try { await o.record(score, passed, paperIds); } catch (e) { return; }
        drawSidebar();
        document.getElementById('submitQuiz').remove();
        const res = document.createElement('div');
        res.className = 'content-card quiz-result';
        res.innerHTML = '<div class="quiz-score ' + (passed ? 'quiz-pass' : 'quiz-fail') + '">' + score + '%</div><div class="quiz-score-sub">' + right + ' of ' + paper.length + ' correct. ' + (passed ? 'Well done, you passed!' : 'The pass mark is ' + pass + '%. Look over the answers below, then try again' + (per < bank.length ? ' with a new set of questions' : '') + '.') + '</div>'
          + (passed ? '<button class="btn btn-primary" id="nx">' + esc(o.nextLabel) + '</button>' : '<button class="btn btn-primary" id="retry">Try again</button>');
        main.prepend(res); window.scrollTo(0, 0);
        if (passed) document.getElementById('nx').onclick = o.onNext;
        else document.getElementById('retry').onclick = o.onRetry;
      };
      document.getElementById('submitQuiz').onclick = () => submit(false);
    }

      const sat = satisfactoryCases().length, open = openCases(cases).length;

      html += '<div class="content-card">' + (locked ? '' : NO_ID_WARNING)
        + '<h2>Details</h2>' + fields.map(f => '<div class="form-group"><label>' + esc(f.label) + (f.required === false ? '' : ' *') + '</label>' + fieldInput(f, c.fields[f.key], locked) + (f.help ? '<div class="ed-help">' + esc(f.help) + '</div>' : '') + '</div>').join('')

          + prompts.map((q, i) => '<div class="form-group"><label>' + esc(q) + ' *</label><textarea id="rf_' + i + '" class="short"' + (locked ? ' disabled' : '') + '>' + esc(c.reflection[i] || '') + '</textarea></div>').join('') : '')
        + (!locked && svs.length > 1 ? '<div class="form-group"><label>Which ' + esc(SUP) + ' supervised this? *</label><select id="cSup"><option value="">Select...</option>' + svs.map(x => '<option value="' + esc(x.id) + '"' + (sv && sv.id === x.id ? ' selected' : '') + '>' + esc(x.supName) + ' (GDC ' + esc(x.supGdc) + ')</option>').join('') + '</select></div>' : '')
        + '<div id="cErr" class="form-error" style="display:none;margin-bottom:0.75rem"></div>'
        + (locked ? '' : '<div class="admin-actions"><button class="btn btn-outline" id="cSave">Save draft</button><button class="btn btn-primary" id="cSubmit">Submit for sign-off</button>' + (!isNew ? '<button class="btn btn-sm" style="background:none;color:var(--warn)" id="cDelete">Delete draft</button>' : '') + '</div>')
        + '</div>';
      main.innerHTML = html; window.scrollTo(0, 0);
      const minWords = Number((String(P.reflectionWords || '').match(/\d+/) || [0])[0]);
      const countWords = () => { const n = prompts.reduce((t, q, i) => t + words(document.getElementById('rf_' + i).value), 0); const el = document.getElementById('rCount'); if (el) el.textContent = '(' + n + ' words so far)'; return n; };
      prompts.forEach((q, i) => document.getElementById('rf_' + i).addEventListener('input', countWords)); if (prompts.length) countWords();
      document.getElementById('cBack').onclick = (e) => { e.preventDefault(); showLogbook(); };
      const collect = () => {
        const f = {}; fields.forEach(x => { f[x.key] = document.getElementById('cf_' + x.key).value.trim(); });
        const r = {}; prompts.forEach((q, i) => { r[i] = document.getElementById('rf_' + i).value.trim(); });
        return { ...c, fields: f, reflection: r };
      };
      const pickSv = () => { const el = document.getElementById('cSup'); return el ? svById(el.value) : sv; };
      const err = (m) => { const e = document.getElementById('cErr'); e.textContent = m; e.style.display = m ? 'block' : 'none'; };
      async function store(data) {
        const id = await D.saveCase({ ...data, learnerUid: user.uid, learnerName: user.name, slug, courseTitle: course.title, createdAt: data.createdAt || new Date().toISOString() });
        await loadPractical(); return id;
      }
      const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
      on('cSave', async () => { try { const id = await store({ ...collect(), status: 'draft' }); toast('Draft saved', 'success'); showCase(cases.find(x => x.id === id)); } catch (e) { console.error(e); err('Could not save. Please try again.'); } });
      on('cSubmit', async () => {
        const data = collect();
        const missing = fields.filter(x => x.required !== false && !data.fields[x.key]);
        if (missing.length) return err('Please complete: ' + missing.map(x => x.label).join(', ') + '.');
        if (prompts.some((q, i) => !data.reflection[i])) return err('Please answer every reflection question.');
        if (minWords && countWords() < minWords) return err('Your reflection needs at least ' + minWords + ' words in total.');
        const to = pickSv();
        if (!to) return err(svs.length ? 'Choose which ' + SUP + ' supervised this.' : 'Your ' + SUP + ' must be approved before you can submit.');
        if (!confirm('Submit this to ' + to.supName + ' for sign-off? You will not be able to change it once it is signed.')) return;
        try {
          await store({ ...data, status: 'submitted', supervisionId: to.id, supervisorUid: to.supervisorUid, supervisorName: to.supName, submittedAt: new Date().toISOString() });
          emailSupervisor(to, 'Logbook ' + NOUN + ' to sign off for ' + user.name, user.name + ' has submitted a logbook ' + NOUN + ' for you to check and sign off. Please log in using the link below.', SITE + 'supervisor.html');
          toast('Sent to ' + to.supName + ' for sign-off', 'success'); showLogbook();
        } catch (e) { console.error(e); err('Could not submit. Please try again.'); }
      });
      on('cDelete', async () => { if (!confirm('Delete this draft?')) return; await D.deleteCase(c.id); await loadPractical(); showLogbook(); });
      on('cRemind', (e) => { e.preventDefault(); const to = svById(c.supervisionId); if (to) emailSupervisor(to, 'Reminder: logbook ' + NOUN + ' to sign off for ' + user.name, user.name + ' is waiting for you to sign off a logbook ' + NOUN + '.', SITE + 'supervisor.html'); toast('Email sent', 'success'); });
      on('cUnsubmit', async (e) => { e.preventDefault(); if (!confirm('Take this back to edit it? You will need to submit it again.')) return; const { signoff, ...rest } = c; await store({ ...rest, status: 'draft' }); showCase(cases.find(x => x.id === c.id)); });
    }

    // ── Written work (case study, written tasks, reflections...) ────────
    // Field types: text, textarea (with word limits), select, rows (a simple table)
    function assignFieldHtml(f, val, editable) {
      const id = 'af_' + f.key;
      const wr = wordRange(f.minWords, f.maxWords);
      let input;
      if (f.type === 'rows') {
        const cols = f.columns || [];
        const rows = Array.isArray(val) && val.length ? val : [cols.map(() => '')];
        input = '<div style="overflow-x:auto"><table class="admin-table" id="' + id + '" data-rows><thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + (editable ? '<th></th>' : '') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + cols.map((c, ci) => '<td>' + (editable ? '<input type="text" value="' + esc(r[ci] || '') + '"/>' : esc(r[ci] || '')) + '</td>').join('') + (editable ? '<td><button type="button" class="mini-btn" data-delrow style="color:var(--warn)">✕</button></td>' : '') + '</tr>').join('')
          + '</tbody></table></div>' + (editable ? '<button type="button" class="btn btn-outline btn-sm" data-addrow="' + esc(f.key) + '" style="margin-top:0.4rem">＋ Add a row</button>' : '');
      } else input = fieldInput(f, val, !editable, 'af_');
      return '<div class="form-group"><label>' + esc(f.label) + (f.required === false ? ' (optional)' : '') + '</label>' + (f.help ? '<div class="ed-help" style="margin:0 0 0.35rem">' + md(f.help) + '</div>' : '') + input
        + (f.type === 'textarea' ? '<div class="ed-help" data-wc="' + esc(f.key) + '"></div>' : '') + (wr && f.type !== 'textarea' ? '' : '') + '</div>';
    }
    function readAssignField(f) {
      const el = document.getElementById('af_' + f.key);
      if (!el) return '';
      if (f.type === 'rows') return [...el.querySelectorAll('tbody tr')].map(tr => [...tr.querySelectorAll('input')].map(i => i.value.trim())).filter(r => r.some(Boolean));
      return el.value.trim();
    }
    function showAssignment(a) {
      const sub = subOf(a), marked = markOf(a);
      const editable = !adminView && (!sub || (a.marked !== false ? (marked && marked.status === 'needs-development') : false));
      const draft = a.legacy ? (prog.caseStudyDraft ? { text: prog.caseStudyDraft } : null) : ((prog.assignmentDrafts || {})[a.id] || null);
      const vals = sub && !editable ? valuesOf(a, sub) : (draft || valuesOf(a, sub));
      const fields = a.fields || [];
      let html = '<div class="dash-header"><h1>' + esc(a.title) + '</h1>' + (a.intro ? '<p>' + esc(a.intro) + '</p>' : '') + '</div>';
      if (a.marked === false && sub) html += '<div class="callout" style="margin-top:0;border-left-color:var(--success);background:var(--success-light)"><div class="callout-label" style="color:var(--success)">✓ Handed in</div><p>Submitted on ' + fmtDate(sub.submittedAt) + '. Thank you.</p></div><button class="btn btn-primary" id="asNext" style="margin-bottom:1rem">Continue →</button>';
      else if (marked && marked.status === 'satisfactory') html += '<div class="callout" style="margin-top:0;border-left-color:var(--success);background:var(--success-light)"><div class="callout-label" style="color:var(--success)">✓ Marked Satisfactory</div>' + (marked.feedback ? '<div class="md">' + md(marked.feedback) + '</div>' : '') + '</div><button class="btn btn-primary" id="asNext" style="margin-bottom:1rem">Continue →</button>';
      else if (marked && marked.status === 'needs-development') html += '<div class="callout callout-warn" style="margin-top:0"><div class="callout-label">Feedback: amendments needed</div><div class="md">' + md(marked.feedback || '') + '</div><p style="margin-top:0.5rem"><strong>Make the amendments below and resubmit.</strong></p></div>';
      else if (sub) html += '<div class="callout" style="margin-top:0"><div class="callout-label">Submitted for marking</div><p>Submitted on ' + fmtDate(sub.submittedAt) + '. We will mark it and let you know, usually within 5 working days.</p></div>';
      html += '<div class="content-card">' + (a.brief ? '<div class="md">' + md(a.brief) + '</div>' : '')
        + ((a.headings || []).length ? '<h3>Cover these headings</h3><ol>' + a.headings.map(h => '<li>' + esc(h) + '</li>').join('') + '</ol>' : '')
        + (editable ? NO_ID_WARNING : '')
        + (a.pickCase ? '<div class="form-group"><label>Which logbook ' + esc(NOUN) + ' are you writing about?</label><select id="asCase"' + (editable ? '' : ' disabled') + '><option value="">Select...</option>' + satisfactoryCases().map(c => '<option value="' + esc(c.id) + '"' + (sub && sub.caseId === c.id ? ' selected' : '') + '>' + esc(caseNumberLabel(c) + (CATS.length ? '' : ': ' + ((c.fields && c.fields.procedure) || ''))) + '</option>').join('') + '</select></div>' : '')
        + fields.map(f => assignFieldHtml(f, vals[f.key], editable)).join('')
        + '<div id="asErr" class="form-error" style="display:none;margin-bottom:0.75rem"></div>'
        + (editable ? '<div class="admin-actions"><button class="btn btn-outline" id="asSave">Save draft</button><button class="btn btn-primary" id="asSubmit">' + (a.marked === false ? 'Hand in' : sub ? 'Resubmit for marking' : 'Submit for marking') + '</button></div>' : '')
        + '</div>';
      main.innerHTML = html; window.scrollTo(0, 0);
      const counters = fields.filter(f => f.type === 'textarea').map(f => {
        const ta = document.getElementById('af_' + f.key), out = main.querySelector('[data-wc="' + f.key + '"]');
        const upd = () => { const n = words(ta.value), wr = wordRange(f.minWords, f.maxWords); out.textContent = n + ' words' + (wr ? ' (aim for ' + wr + ')' : ''); return n; };
        ta.addEventListener('input', upd); upd(); return { f, upd };
      });
      main.querySelectorAll('[data-addrow]').forEach(b => b.onclick = () => {
        const t = document.getElementById('af_' + b.dataset.addrow), n = t.querySelectorAll('thead th').length - 1;
        const tr = document.createElement('tr'); tr.innerHTML = Array(n).fill('<td><input type="text"/></td>').join('') + '<td><button type="button" class="mini-btn" data-delrow style="color:var(--warn)">✕</button></td>';
        t.querySelector('tbody').appendChild(tr); tr.querySelector('[data-delrow]').onclick = () => tr.remove();
      });
      main.querySelectorAll('[data-delrow]').forEach(b => b.onclick = () => b.closest('tr').remove());
      const err = (m) => { const e = document.getElementById('asErr'); e.textContent = m; e.style.display = m ? 'block' : 'none'; };
      const collect = () => Object.fromEntries(fields.map(f => [f.key, readAssignField(f)]));
      const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
      on('asNext', () => go(nextStep()));
      on('asSave', async () => {
        const v = collect();
        try { await save(a.legacy ? { caseStudyDraft: v.text || '' } : { assignmentDrafts: { ...(prog.assignmentDrafts || {}), [a.id]: v } }); toast('Draft saved', 'success'); } catch (e) {}
      });
      on('asSubmit', async () => {
        const v = collect();
        const caseEl = document.getElementById('asCase'), caseId = caseEl ? caseEl.value : '';
        if (a.pickCase && !caseId) return err('Choose which logbook ' + NOUN + ' you are writing about.');
        for (const f of fields) {
          const val = v[f.key];
          if (f.required !== false && (Array.isArray(val) ? !val.length : !val)) return err('Please complete: ' + f.label + '.');
          if (f.type === 'rows' && Number(f.minRows) && val.length < Number(f.minRows)) return err(f.label + ' needs at least ' + f.minRows + ' rows.');
          if (f.type === 'textarea' && val) {
            const n = words(val), min = Number(f.minWords) || 0, max = Number(f.maxWords) || 0;
            if (min && n < min) return err(f.label + ' needs at least ' + min + ' words. It has ' + n + '.');
            if (max && n > Math.round(max * 1.1)) return err(f.label + ' is ' + n + ' words. Please keep it under ' + max + ' words.');
          }
        }
        if (!confirm(a.marked === false ? 'Hand this in? You will not be able to change it afterwards.' : 'Submit "' + a.title + '" for marking?')) return;
        const n = fields.filter(f => f.type === 'textarea').reduce((t, f) => t + words(v[f.key]), 0);
        const data = { caseId, words: n, submittedAt: new Date().toISOString(), version: ((sub && sub.version) || 0) + 1 };
        try {
          if (a.legacy) await save({ caseStudy: { ...data, text: v.text }, caseStudyDraft: '' });
          else {
            const drafts = { ...(prog.assignmentDrafts || {}), [a.id]: null };
            await save({ assignments: { ...(prog.assignments || {}), [a.id]: { ...data, values: v } }, assignmentDrafts: drafts });
          }
          if (a.marked !== false) D.notify(a.title + ' to mark - ' + course.title, user.name + ' (' + user.email + ') has ' + (sub ? 're' : '') + 'submitted "' + a.title + '" for "' + course.title + '". Mark it in the CPD Hub admin under Marking.', user);
          toast(a.marked === false ? 'Handed in' : 'Submitted for marking', 'success'); drawSidebar(); showAssignment(a);
        } catch (e) { err('Could not submit. Please try again.'); }
      });
    }

    // ── Reflection ───────────────────────────────────────────────────────
    function showReflection() {
      const questions = (content.reflection && content.reflection.length) ? content.reflection : ['What did you learn from this course?', 'How will you apply it in your practice?'];
      const saved = (prog.reflection && prog.reflection.answers) || [];
      main.innerHTML = '<div class="dash-header"><h1>Reflection</h1><p>' + (usesGdc(course) ? 'Reflecting on your learning is a key part of CPD, including the GDC enhanced CPD scheme. ' : 'Reflecting on your learning is a key part of CPD and helps you put it into practice. ') + 'Your answers are saved and shown on the back of your certificate.</p></div>'
        + '<div class="content-card">' + questions.map((q, i) => '<div class="form-group"><label>' + esc(q) + '</label><textarea data-i="' + i + '" class="short">' + esc(saved[i] || '') + '</textarea></div>').join('')
        + '<div id="refErr" class="form-error" style="display:none;margin-bottom:0.75rem"></div><button class="btn btn-primary" id="saveRef">' + (prog.reflection ? 'Update reflection' : 'Save and continue →') + '</button></div>';
      document.getElementById('saveRef').onclick = async () => {
        const answers = [...main.querySelectorAll('textarea')].map(t => t.value.trim());
        if (answers.some(a => a.length < 30)) { const e = document.getElementById('refErr'); e.textContent = 'Please write a little more for each question (at least a sentence or two).'; e.style.display = 'block'; return; }
        try { await save({ reflection: { questions, answers, submittedAt: new Date().toISOString() } }); } catch (e) { return; }
        go(prog.feedback ? 'done' : 'feedback');
      };
    }

    // ── Feedback ─────────────────────────────────────────────────────────
    const FEEDBACK_ITEMS = [
      ['aims', 'The aims and objectives were clear and were met'],
      ['relevant', 'The content was relevant to my practice'],
      ['quality', 'The lessons and activities were good quality'],
      ['recommend', 'I would recommend this course to a colleague'],
    ];
    function showFeedback() {
      const f = prog.feedback || { ratings: {} };
      const ratings = { ...(f.ratings || {}) };
      main.innerHTML = '<div class="dash-header"><h1>Course feedback</h1><p>Your feedback helps us keep our CPD high quality. Rate each statement from 1 (strongly disagree) to 5 (strongly agree).</p></div>'
        + '<div class="content-card">' + FEEDBACK_ITEMS.map(([k, label]) => '<div class="rating-row"><span>' + esc(label) + '</span><span class="rating-btns" data-k="' + k + '">' + [1, 2, 3, 4, 5].map(n => '<button type="button" data-n="' + n + '"' + (ratings[k] === n ? ' class="on"' : '') + '>' + n + '</button>').join('') + '</span></div>').join('')
        + '<div class="form-group" style="margin-top:1.25rem"><label>Was the course free from commercial bias (for example, promoting a particular product)?</label><select id="bias"><option value="">Select...</option><option' + (f.bias === 'Yes' ? ' selected' : '') + '>Yes</option><option' + (f.bias === 'No' ? ' selected' : '') + '>No</option></select></div>'
        + '<div class="form-group"><label>Roughly how long did the course take you?</label><select id="time"><option value="">Select...</option>' + ['Less than 30 minutes', '30 minutes to 1 hour', '1 to 2 hours', '2 to 3 hours', 'More than 3 hours'].map(t => '<option' + (f.time === t ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></div>'
        + '<div class="form-group"><label>Any other comments or suggestions? (optional)</label><textarea id="comments" class="short">' + esc(f.comments || '') + '</textarea></div>'
        + '<div id="fbErr" class="form-error" style="display:none;margin-bottom:0.75rem"></div><button class="btn btn-primary" id="saveFb">' + (prog.feedback ? 'Update feedback' : 'Submit and get my certificate →') + '</button></div>';
      main.querySelectorAll('.rating-btns').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
        g.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); ratings[g.dataset.k] = Number(b.dataset.n);
      }));
      document.getElementById('saveFb').onclick = async () => {
        const bias = document.getElementById('bias').value, time = document.getElementById('time').value;
        if (FEEDBACK_ITEMS.some(([k]) => !ratings[k]) || !bias || !time) { const e = document.getElementById('fbErr'); e.textContent = 'Please answer every rating and both drop-down questions.'; e.style.display = 'block'; return; }
        const data = { feedback: { ratings, bias, time, comments: document.getElementById('comments').value.trim(), submittedAt: new Date().toISOString() } };
        const first = !prog.completedAt;
        if (first) {
          const d = new Date();
          data.completedAt = d.toISOString();
          if (P) {
            const used = approvedSupervisions().filter(sv => satisfactoryCases().some(c => c.supervisionId === sv.id));
            const st = lbStatus();
            data.practical = { supervisors: used.map(sv => ({ name: (sv.agreement && sv.agreement.name) || sv.supName, gdc: (sv.agreement && sv.agreement.gdc) || sv.supGdc })),
              casesSignedOff: st.satCount, declaredAt: st.declared ? st.declared.finalDeclaration.signedAt : '',
              marked: Object.fromEntries(ASSIGN.filter(a => a.marked !== false).map(a => [a.id, (markOf(a) || {}).markedAt || ''])) };
          }
          data.certNo = 'DNT-CPD-' + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();
        }
        try { await save(data); } catch (e) { return; }
        if (first && !adminView) D.notify('CPD course completed - ' + course.title, user.name + ' (' + user.email + ', GDC ' + (user.gdc || 'not given') + ') has completed "' + course.title + '". Certificate number ' + data.certNo + '.', user);
        go('done');
      };
    }

    // ── Done ─────────────────────────────────────────────────────────────
    function showDone() {
      main.innerHTML = '<div class="content-card" style="text-align:center;padding:3rem 2rem"><div style="font-size:3.5rem;margin-bottom:0.75rem">🎉</div><h2 style="border:none;padding:0;margin-bottom:0.5rem">Course complete!</h2>'
        + (verifiableFor(course, user)
          ? '<p>Well done ' + esc(user.name.split(' ')[0]) + '. You have earned <strong>' + esc(course.hours) + ' hour' + (Number(course.hours) === 1 ? '' : 's') + '</strong> of verifiable CPD.</p>'
            + '<p style="font-size:0.9rem">Keep a copy of your certificate for your CPD record, and remember to log the hours against your personal development plan (PDP) for your GDC annual statement.</p>'
          : '<p>Well done ' + esc(user.name.split(' ')[0]) + '. You have earned <strong>' + esc(course.hours) + ' hour' + (Number(course.hours) === 1 ? '' : 's') + '</strong> of CPD.</p><p style="font-size:0.9rem">Your CPD certificate is ready to view, print or save.' + (cpdType(course) === 'both' ? ' If you are a dental professional, add your GDC number in My CPD → My details and your certificate will become a verifiable CPD certificate.' : '') + '</p>')
        + '<a class="btn btn-primary btn-lg" target="_blank" href="' + D.link('certificate.html?c=' + encodeURIComponent(slug)) + '" style="margin-top:0.75rem">🏅 View and print certificate</a><br/>'
        + '<a class="btn btn-outline" href="' + D.link('dashboard.html') + '" style="margin-top:0.75rem">Back to My CPD</a></div>';
      if (adminView) main.querySelector('.btn-primary').outerHTML = '<p style="color:var(--ink-light);font-size:0.85rem">(Certificates are only created for learners.)</p>';
    }

    document.getElementById('menuBtn').onclick = () => { sidebar.classList.add('mobile-open'); document.getElementById('backdrop').classList.add('visible'); };
    document.getElementById('backdrop').onclick = () => { sidebar.classList.remove('mobile-open'); document.getElementById('backdrop').classList.remove('visible'); };

    const startAt = qs('step');
    go(startAt && unlocked(startAt) ? startAt : (prog.lessonsDone.length ? firstOpenStep() : 'intro'));
  </script>
</body>
</html>
