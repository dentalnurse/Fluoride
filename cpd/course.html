<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/gate.js"></script>
  <meta name="robots" content="noindex, nofollow"/>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0L9NXXFBFR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0L9NXXFBFR');
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course - Dental Nurse Training CPD Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="css/cpd.css"/>
</head>
<body>
  <div id="navHolder"></div>
  <div class="course-hero">
    <div class="container">
      <p class="crumbs"><a id="homeCrumb" href="index.html">CPD Hub</a> / <span id="crumbCat">Course</span></p>
      <div class="ch-tags" id="cTags"></div>
      <h1 id="cTitle">Loading...</h1>
      <p class="ch-summary" id="cSummary"></p>
      <div class="ch-chips" id="cChips"></div>
    </div>
  </div>

  <div class="container">
    <div class="cd-grid" id="detail" style="display:none">
      <div class="cd-main">
        <div class="cd-section">
          <h2>What you'll learn</h2>
          <div id="cObjectives"></div>
        </div>
        <div class="cd-section">
          <h2>Course content</h2>
          <div id="cLessons"></div>
        </div>
        <div class="cd-section">
          <h2>About this course</h2>
          <div class="cd-card">
            <p id="cAims"></p>
            <div id="outcomesBlock" style="margin-top:1rem">
              <p style="font-weight:700;color:var(--ink);margin-bottom:0.25rem">GDC development outcomes</p>
              <div id="cOutcomes"></div>
            </div>
            <p style="font-size:0.8rem;color:var(--ink-light);margin-top:1rem">Content last reviewed <span id="sUpdated"></span>.</p>
          </div>
        </div>
        <div class="cd-section" id="noteBlock" style="display:none">
          <div class="callout callout-warn" style="margin:0"><div class="callout-label">Please note</div><p id="cNote"></p></div>
        </div>
      </div>
      <aside>
        <div class="price-card">
          <div class="pc-visual" id="cVisual"></div>
          <div class="pc-body">
            <div class="pc-price" id="sPrice"></div>
            <div class="pc-sub" id="sHours"></div>
            <div id="action"></div>
            <div class="pc-includes">
              <div><span>✓</span><span>Learn online at your own pace</span></div>
              <div><span>✓</span><span id="incLessons"></span></div>
              <div><span>✓</span><span>Interactive activities and a quiz</span></div>
              <div><span>✓</span><span id="incCert"></span></div>
              <div><span>✓</span><span>Saved to your CPD Hub account</span></div>
            </div>
            <p style="font-size:0.78rem;color:var(--ink-light);margin-top:1rem;line-height:1.55" id="sAudience"></p>
          </div>
        </div>
      </aside>
    </div>
    <div id="notFound" class="empty-state" style="display:none;margin:2.5rem 0"><div class="es-icon">🔍</div><h3>Course not found</h3><p><a href="index.html" id="backLink" style="color:var(--teal);font-weight:700">Back to all courses</a></p></div>
  </div>

  <div id="footHolder"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/demo-course.js"></script>
  <script type="module">
    import * as D from './js/data.js';
    const user = await D.mountChrome();
    document.getElementById('homeCrumb').href = D.link('index.html');
    document.getElementById('backLink').href = D.link('index.html');

    const slug = qs('c');
    const course = slug ? await D.getCourse(slug) : null;
    if (!course || !['live', 'coming-soon'].includes(course.status) && !(user && user.isAdmin)) {
      document.getElementById('cTitle').textContent = 'Course not found';
      document.getElementById('notFound').style.display = 'block';
      throw new Error('not found');
    }
    const t = cpdType(course);
    document.title = course.title + ' - Dental Nurse Training CPD Hub';
    document.getElementById('crumbCat').textContent = course.category || 'Course';
    document.getElementById('cTags').innerHTML = (course.category ? '<span class="ch-tag">' + esc(course.category) + '</span>' : '')
      + '<span class="ch-tag">' + esc({ verifiable: 'Verifiable CPD', both: 'GDC verifiable CPD', general: 'CPD' }[t]) + '</span>'
      + (course.status === 'coming-soon' ? '<span class="ch-tag">Coming soon</span>' : '');
    document.getElementById('cTitle').textContent = course.title;
    document.getElementById('cSummary').textContent = course.summary || '';
    document.getElementById('cChips').innerHTML = courseChips(course);
    document.getElementById('cObjectives').innerHTML = objectivesGrid(course);
    document.getElementById('cLessons').innerHTML = lessonList(course);
    document.getElementById('cAims').textContent = course.aims || '';
    if (usesGdc(course)) document.getElementById('cOutcomes').innerHTML = outcomesBadges(course);
    else document.getElementById('outcomesBlock').style.display = 'none';
    if (course.certNote) { document.getElementById('cNote').textContent = course.certNote; document.getElementById('noteBlock').style.display = ''; }
    document.getElementById('sUpdated').textContent = fmtDate(course.updated) || 'recently';
    document.getElementById('cVisual').innerHTML = courseVisual(course);
    document.getElementById('sPrice').textContent = course.status === 'coming-soon' ? 'Coming soon' : course.price;
    document.getElementById('sHours').textContent = hoursText(course);
    const n = (course.lessonTitles || []).length;
    document.getElementById('incLessons').textContent = n + ' short lesson' + (n === 1 ? '' : 's');
    document.getElementById('incCert').textContent = { verifiable: 'Verifiable CPD certificate', both: 'Verifiable CPD certificate (with your GDC number)', general: 'CPD certificate' }[t];
    document.getElementById('sAudience').textContent = audienceText(course);
    document.getElementById('detail').style.display = '';

    const action = document.getElementById('action');
    const btn = (href, label) => '<a href="' + href + '" class="btn btn-primary btn-lg" style="width:100%">' + label + '</a>';
    const small = (html) => '<p style="text-align:center;margin-top:0.7rem;font-size:0.84rem;color:var(--ink-light)">' + html + '</p>';
    const linkStyle = 'color:var(--teal);font-weight:700;text-decoration:underline';

    if (course.status === 'coming-soon') {
      action.innerHTML = '<div class="pc-note">This course is coming soon. Create a free account and you will be ready to start as soon as it launches.</div>';
    } else if (!user) {
      const next = encodeURIComponent('course.html?c=' + slug);
      action.innerHTML = btn(D.link('register.html?next=' + next), 'Create account to buy')
        + small('Already registered? <a href="' + D.link('login.html?next=' + next) + '" style="' + linkStyle + '">Log in</a>');
    } else {
      const access = await D.getAccess(user.uid);
      const orders = await D.getOrders(user.uid);
      const order = orders.find(o => o.slug === slug);
      if (access[slug]) {
        action.innerHTML = btn(D.link('learn.html?c=' + slug), 'Go to course →') + small('You have access to this course.');
      } else if (order && order.status === 'pending') {
        action.innerHTML = '<div class="pc-note">⏳ <strong>Payment being checked.</strong> Your course will be unlocked within 1 working day. We will email you when it is ready.</div>'
          + small('Not finished paying? <a href="#" id="payAgain" style="' + linkStyle + '">Go to payment</a>');
        document.getElementById('payAgain').onclick = (e) => { e.preventDefault(); buy(); };
      } else {
        action.innerHTML = '<button class="btn btn-primary btn-lg" style="width:100%" id="buyBtn">Buy course</button>' + small('🔒 Secure payment by Stripe');
        document.getElementById('buyBtn').onclick = buy;
      }
      if (!access[slug] && user.isAdmin) action.insertAdjacentHTML('beforeend', small('<a href="' + D.link('learn.html?c=' + slug) + '" style="' + linkStyle + '">Open as admin (nothing is saved)</a>'));
    }

    async function buy() {
      if (cpdType(course) === 'verifiable' && !user.gdc && !confirm('Verifiable CPD certificates show your GDC number, and you have not added one yet. You can add it any time in My CPD → My details.\n\nContinue to buy anyway?')) return;
      if (!D.PREVIEW && !course.stripeLink) { toast('Payment for this course is not set up yet. Please contact us.', 'error'); return; }
      try { await D.createOrder(user, course); } catch (e) { console.error(e); toast('Something went wrong. Please try again.', 'error'); return; }
      if (D.PREVIEW) {
        alert('Preview mode: no payment is taken. An order has been created - open Admin → Payments to check and unlock it, just as you would for a real learner.');
        location.reload(); return;
      }
      const sep = course.stripeLink.includes('?') ? '&' : '?';
      location.href = course.stripeLink + sep + 'prefilled_email=' + encodeURIComponent(user.email) + '&client_reference_id=' + encodeURIComponent(user.uid + '__' + slug);
    }
  </script>
</body>
</html>
