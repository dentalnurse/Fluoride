<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0L9NXXFBFR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0L9NXXFBFR');
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Hub - Dental Nurse Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .hub-filters { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.1rem; align-items:center; }
    .hub-filter-btn { padding:0.4rem 0.9rem; border-radius:100px; font-size:0.8rem; font-weight:600; cursor:pointer; border:1.5px solid var(--border); background:var(--white); color:var(--ink-mid); }
    .hub-filter-btn.active { background:var(--teal-dark); color:var(--white); border-color:var(--teal-dark); }
    .hub-search { flex:1; min-width:180px; max-width:280px; padding:0.5rem 0.9rem; border:1.5px solid var(--border); border-radius:100px; font-size:0.85rem; }
    .hub-toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem; }
    .checklist-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:0.6rem 1.25rem; margin:0.75rem 0 1.25rem; }
    .checklist-item { display:flex; align-items:flex-start; gap:0.55rem; font-size:0.86rem; color:var(--ink-mid); cursor:pointer; }
    .checklist-item input { margin-top:0.2rem; width:16px; height:16px; accent-color:var(--teal); flex-shrink:0; }
    .checklist-item.checked span { color:var(--ink); text-decoration:line-through; text-decoration-color:var(--border); }
    .note-item { border-left:3px solid var(--teal-light); padding:0.5rem 0.75rem; margin-bottom:0.6rem; background:var(--off-white); border-radius:0 var(--radius) var(--radius) 0; }
    .note-item .note-meta { font-size:0.72rem; color:var(--ink-light); margin-top:0.25rem; }
    .note-item .note-text { font-size:0.86rem; color:var(--ink); white-space:pre-wrap; }
    .empty-state { text-align:center; padding:2.5rem 1rem; color:var(--ink-light); font-size:0.9rem; }
    .hub-flag { color:#D93025; font-size:0.95rem; }
    .assessor-chip { display:inline-flex; align-items:center; gap:0.4rem; background:var(--teal-pale); border:1px solid var(--teal-light); color:var(--teal-dark); padding:0.35rem 0.75rem; border-radius:100px; font-size:0.82rem; font-weight:600; margin:0 0.4rem 0.4rem 0; }
    .assessor-chip button { background:none; border:none; color:var(--teal-dark); cursor:pointer; font-size:0.95rem; line-height:1; opacity:0.6; }
    .assessor-chip button:hover { opacity:1; }
    .attention-list { display:flex; flex-direction:column; gap:0.5rem; }
    .attention-row { display:flex; justify-content:space-between; align-items:center; gap:0.75rem; padding:0.6rem 0.9rem; background:var(--white); border:1px solid #F59E0B; border-radius:var(--radius); font-size:0.85rem; cursor:pointer; }
    .attention-row:hover { background:#FFFBEB; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media (max-width:640px){ .field-row{ grid-template-columns:1fr; } .admin-stat-row{ grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>

  <!-- Login screen (shown before auth) -->
  <div id="hubLogin" class="auth-wrap">
    <div class="auth-card" style="max-width:400px">
      <div class="auth-logo">
        <img src="https://dentalnurse.training/wp-content/uploads/2023/05/WEBLOGO.png"
             alt="Dental Nurse Training" style="height:56px;margin:0 auto 1rem" onerror="this.style.display='none'"/>
        <h2>Student Hub</h2>
        <p style="font-size:0.85rem;color:var(--ink-light);margin-top:0.25rem">Onboarding, enquiries &amp; tasks</p>
      </div>
      <div class="form-group">
        <label>Admin email</label>
        <input type="email" id="hubEmail" value="emily@dentalnurse.training"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="hubPass" placeholder="••••••••"/>
      </div>
      <div id="hubLoginErr" class="form-error" style="display:none"></div>
      <button class="btn btn-primary form-submit" onclick="hubLogin()">Log in</button>
    </div>
  </div>

  <!-- Hub panel (shown after auth) -->
  <div id="hubPanel" style="display:none">
    <div class="admin-header">
      <div>
        <h1>Student Hub</h1>
        <span style="font-size:0.8rem;opacity:0.6">Onboarding · Enquiries · Tasks</span>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
        <a href="admin/index.html" class="btn btn-outline btn-sm" style="border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.8)">⚙️ Course Admin</a>
        <span id="hubUserEmail" style="font-size:0.85rem;color:rgba(255,255,255,0.6)"></span>
        <button class="btn btn-outline btn-sm" style="border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.8)" onclick="hubLogout()">Log out</button>
      </div>
    </div>

    <div class="admin-panel">
      <!-- Needs-attention banner -->
      <div id="hubAttentionBanner" style="display:none;background:#FEF3C7;border:1.5px solid #F59E0B;border-radius:var(--radius);padding:0.85rem 1.25rem;margin-bottom:1.25rem;font-size:0.88rem;color:#92400E;align-items:center;gap:0.6rem;flex-wrap:wrap">
        <span style="font-size:1.1rem">🔔</span>
        <span id="hubAttentionText" style="font-weight:600"></span>
      </div>

      <!-- Stats row -->
      <div class="admin-stat-row">
        <div class="admin-stat"><div class="as-n" id="statOnbActive">-</div><div class="as-lbl">Active onboarding</div></div>
        <div class="admin-stat" id="statAttentionTile"><div class="as-n" id="statAttention">-</div><div class="as-lbl">Needs attention</div></div>
        <div class="admin-stat"><div class="as-n" id="statInquiries">-</div><div class="as-lbl">Open enquiries</div></div>
        <div class="admin-stat"><div class="as-n" id="statTasks">-</div><div class="as-lbl">Open tasks</div></div>
        <div class="admin-stat"><div class="as-n" id="statCompletedMonth">-</div><div class="as-lbl">Completed this month</div></div>
      </div>

      <!-- Tabs -->
      <div class="admin-tabs">
        <div class="admin-tab active" data-tab="overview" onclick="switchHubTab('overview')">🏠 Overview</div>
        <div class="admin-tab" data-tab="onboarding" onclick="switchHubTab('onboarding')">🎓 Onboarding</div>
        <div class="admin-tab" data-tab="inquiries" onclick="switchHubTab('inquiries')">📞 Enquiries</div>
        <div class="admin-tab" data-tab="tasks" onclick="switchHubTab('tasks')">✅ Tasks</div>
        <div class="admin-tab" data-tab="assessors" onclick="switchHubTab('assessors')">👥 Assessors</div>
        <div class="admin-tab" data-tab="archive" onclick="switchHubTab('archive')">📦 Archive</div>
      </div>

      <div id="hubTabContent">
        <div style="text-align:center;padding:3rem;color:var(--ink-light)">Loading…</div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal-overlay hidden" id="onbModal"><div class="modal" id="onbModalContent" style="max-width:720px;width:100%"></div></div>
  <div class="modal-overlay hidden" id="inqModal"><div class="modal" id="inqModalContent" style="max-width:640px;width:100%"></div></div>
  <div class="modal-overlay hidden" id="taskModal"><div class="modal" id="taskModalContent" style="max-width:560px;width:100%"></div></div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, addDoc, updateDoc, deleteDoc, getDoc, setDoc, arrayUnion, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── Config: programmes & checklist templates ─────────────────────────────
    const PROGRAMMES = ['Diploma','NEBDN RAD','BDA RAD','BDA OHE','NEBDN OHE','NEBDN FVA','Other'];

    const CORE_CHECKLIST = [
      { k:'contact',           l:'Added to phone / WhatsApp & contacted' },
      { k:'id',                l:'Photo ID received' },
      { k:'courseInfoSent',    l:'Course info / induction & SMA sent' },
      { k:'qEmployerSent',     l:'Employer questionnaire sent' },
      { k:'qLearnerSent',      l:'Learner questionnaire sent' },
      { k:'qEmployerReceived', l:'Employer questionnaire received' },
      { k:'qLearnerReceived',  l:'Learner questionnaire received' },
      { k:'smaEmployer',       l:'SMA signed - employer' },
      { k:'smaLearner',        l:'SMA signed - learner' },
      { k:'smaProvider',       l:'SMA signed - provider' },
      { k:'enrolled',          l:'Enrolled with awarding body' },
      { k:'loginsSent',        l:'DNT logins sent' },
      { k:'adjustments',       l:'Adjustments checked & noted' },
    ];
    const EXTRA_CHECKLIST = {
      'Diploma': [
        { k:'teamsBrief',          l:'Teams brief / intro call done' },
        { k:'qDiscussed',          l:'Questionnaires discussed with learner & practice' },
        { k:'inductionDocs',       l:'Induction docs completed' },
        { k:'hepB',                l:'Hep B evidence received' },
        { k:'iqaDoc',              l:'Added to IQA tracking doc' },
        { k:'pebblepadSMA',        l:'SMA added to Pebblepad' },
        { k:'pebblepadAssessor',   l:'Assessor & IQA details added to Pebblepad' },
      ],
      'NEBDN RAD': [
        { k:'trainingSupportSheet', l:'Training support sheet received' },
        { k:'pebblepadWitnesses',   l:'Pebblepad witnesses sent' },
        { k:'tutorCloud',           l:'Moved to Tutor Cloud' },
        { k:'iqaDoc',               l:'Added to IQA tracking doc' },
      ],
      'NEBDN OHE': [
        { k:'trainingSupportSheet', l:'Training support sheet received' },
        { k:'pebblepadWitnesses',   l:'Pebblepad witnesses sent' },
        { k:'tutorCloud',           l:'Moved to Tutor Cloud' },
        { k:'iqaDoc',               l:'Added to IQA tracking doc' },
      ],
      'NEBDN FVA': [],
      'BDA RAD': [
        { k:'whatsapp',          l:'WhatsApp voicenote sent' },
        { k:'accountIdILP',      l:'Account ID added to ILP' },
        { k:'contractReceived',  l:'BDA contract received' },
        { k:'gdcLearner',        l:"Learner's GDC checked & added to ILP" },
        { k:'gdcSupervisor',     l:'Supervisor GDC & status checked (must be dentist)' },
        { k:'tutorCloudBDA',     l:'Into Tutor Cloud & added to BDA enrolment sheet' },
      ],
      'BDA OHE': [
        { k:'whatsapp',          l:'WhatsApp voicenote sent' },
        { k:'callWithLearner',   l:'Call with learner done' },
        { k:'accountIdILP',      l:'Account ID added to ILP' },
        { k:'contractReceived',  l:'BDA contract received' },
        { k:'gdcLearner',        l:"Learner's GDC checked & added to ILP" },
        { k:'gdcSupervisor',     l:'Supervisor GDC & status checked (must be dentist)' },
        { k:'tutorCloudBDA',     l:'Into Tutor Cloud & added to BDA enrolment sheet' },
      ],
      'Other': [],
    };
    function getChecklist(programme) { return CORE_CHECKLIST.concat(EXTRA_CHECKLIST[programme] || []); }
    const BDA_PROGRAMMES = ['BDA RAD', 'BDA OHE'];

    const PAYMENT_STATUSES = ['Not started','Instalments','Paid in full','Waiting on payment','Withdrawn'];

    const ONB_STATUS = {
      not_started: { label:'Not started',   pill:'pill-grey' },
      in_progress: { label:'In progress',   pill:'pill-teal' },
      issue:       { label:'Needs attention', pill:'pill-red' },
      completed:   { label:'Completed - moved to ILP', pill:'pill-green' },
    };
    const INQ_STATUS = {
      new:               { label:'New',               pill:'pill-teal' },
      contacted:         { label:'Contacted',          pill:'pill-teal' },
      info_sent:         { label:'Info sent',          pill:'pill-teal' },
      awaiting_decision: { label:'Awaiting decision',  pill:'pill-orange' },
      converted:         { label:'Converted',          pill:'pill-green' },
      lost:              { label:'Lost / not proceeding', pill:'pill-grey' },
    };
    const STALE_DAYS = 5;

    // ── State ──────────────────────────────────────────────────────────────
    let onboarding = [], inquiries = [], tasks = [], assessorNames = [];
    let currentTab = 'overview';
    let onbFilter = { programme:'all', status:'all', q:'' };
    let inqFilter = { status:'all', q:'' };
    let taskFilter = { assessor:'all', status:'open' };

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function showToast(msg, type='success') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show ' + type;
      setTimeout(() => t.className = 'toast', 2500);
    }
    function fmtDate(v) {
      if (!v) return '—';
      const d = typeof v === 'number' ? new Date(v) : (v.toDate ? v.toDate() : new Date(v));
      if (isNaN(d.getTime())) return '—';
      return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    }
    function daysSince(v) {
      if (!v) return null;
      const d = typeof v === 'number' ? new Date(v) : (v.toDate ? v.toDate() : new Date(v));
      if (isNaN(d.getTime())) return null;
      return Math.floor((Date.now() - d.getTime()) / 86400000);
    }
    function currentUserLabel() {
      const email = auth.currentUser ? auth.currentUser.email : '';
      const first = (email.split('@')[0] || 'Admin');
      return first.charAt(0).toUpperCase() + first.slice(1);
    }
    function noteEntry(text) { return { text, author: currentUserLabel(), at: Date.now() }; }
    function sortedNotes(rec) { return (rec.notes || []).slice().sort((a,b) => (b.at||0) - (a.at||0)); }

    function checklistProgress(rec) {
      const items = getChecklist(rec.programme || 'Other');
      const cl = rec.checklist || {};
      const done = items.filter(i => cl[i.k]).length;
      return { done, total: items.length, pct: items.length ? Math.round(done / items.length * 100) : 0 };
    }
    function isOnbStale(rec) {
      if (rec.statusBucket === 'completed') return false;
      const d = daysSince(rec.updatedAt || rec.createdAt);
      return d !== null && d >= STALE_DAYS;
    }
    function isInqStale(rec) {
      if (rec.status === 'converted' || rec.status === 'lost') return false;
      const d = daysSince(rec.updatedAt || rec.createdAt);
      return d !== null && d >= STALE_DAYS;
    }
    function needsAttention(rec, kind) {
      return !!rec.flagged || (kind === 'onb' ? isOnbStale(rec) : isInqStale(rec));
    }

    function allAssessors() {
      const known = ['Emily', 'Erica'];
      return Array.from(new Set([...known, ...assessorNames])).sort();
    }

    // ── Auth ───────────────────────────────────────────────────────────────
    onAuthStateChanged(auth, (user) => {
      if (user && ADMIN_EMAILS.includes(user.email)) {
        document.getElementById('hubLogin').style.display = 'none';
        document.getElementById('hubPanel').style.display  = '';
        document.getElementById('hubUserEmail').textContent = user.email;
        loadAll();
      }
    });
    window.hubLogin = async () => {
      const email = document.getElementById('hubEmail').value.trim();
      const pass  = document.getElementById('hubPass').value;
      const err   = document.getElementById('hubLoginErr');
      if (!ADMIN_EMAILS.includes(email)) {
        err.textContent = 'Invalid admin credentials.'; err.style.display = 'block'; return;
      }
      try { await signInWithEmailAndPassword(auth, email, pass); }
      catch(e) { err.textContent = 'Login failed. Please check your password.'; err.style.display = 'block'; }
    };
    window.hubLogout = async () => {
      await signOut(auth);
      document.getElementById('hubLogin').style.display = '';
      document.getElementById('hubPanel').style.display  = 'none';
    };

    // ── Load data ──────────────────────────────────────────────────────────
    async function loadAll() {
      const [onbSnap, inqSnap, taskSnap, settingsSnap] = await Promise.all([
        getDocs(collection(db, 'hubOnboarding')),
        getDocs(collection(db, 'hubInquiries')),
        getDocs(collection(db, 'hubTasks')),
        getDoc(doc(db, 'hubSettings', 'assessors')).catch(() => null),
      ]);
      onboarding = onbSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      inquiries  = inqSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      tasks      = taskSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      assessorNames = (settingsSnap && settingsSnap.exists()) ? (settingsSnap.data().names || []) : [];
      renderAll();
    }

    function renderAll() {
      renderStats();
      renderAttentionBanner();
      renderTab();
    }

    function renderStats() {
      const active = onboarding.filter(r => r.statusBucket !== 'completed').length;
      const attention = onboarding.filter(r => needsAttention(r,'onb')).length + inquiries.filter(r => needsAttention(r,'inq')).length;
      const openInq = inquiries.filter(r => r.status !== 'converted' && r.status !== 'lost').length;
      const openTasks = tasks.filter(t => t.status !== 'done').length;
      const now = new Date();
      const completedMonth = onboarding.filter(r => {
        if (r.statusBucket !== 'completed' || !r.completedAt) return false;
        const d = new Date(r.completedAt);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).length;
      document.getElementById('statOnbActive').textContent = active;
      document.getElementById('statAttention').textContent = attention;
      document.getElementById('statInquiries').textContent = openInq;
      document.getElementById('statTasks').textContent = openTasks;
      document.getElementById('statCompletedMonth').textContent = completedMonth;
      document.getElementById('statAttentionTile').classList.toggle('needs-attention', attention > 0);
    }

    function renderAttentionBanner() {
      const flaggedOnb = onboarding.filter(r => needsAttention(r,'onb')).length;
      const flaggedInq = inquiries.filter(r => needsAttention(r,'inq')).length;
      const overdueTasks = tasks.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < new Date().toISOString().slice(0,10)).length;
      const banner = document.getElementById('hubAttentionBanner');
      const total = flaggedOnb + flaggedInq + overdueTasks;
      if (total === 0) { banner.style.display = 'none'; return; }
      banner.style.display = 'flex';
      const parts = [];
      if (flaggedOnb) parts.push(flaggedOnb + ' onboarding record' + (flaggedOnb>1?'s':'') + ' need' + (flaggedOnb===1?'s':'') + ' attention');
      if (flaggedInq) parts.push(flaggedInq + ' enquir' + (flaggedInq>1?'ies':'y') + ' gone quiet');
      if (overdueTasks) parts.push(overdueTasks + ' task' + (overdueTasks>1?'s':'') + ' overdue');
      document.getElementById('hubAttentionText').textContent = parts.join(' · ');
    }

    window.switchHubTab = (tab) => {
      currentTab = tab;
      document.querySelectorAll('.admin-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
      renderTab();
    };

    function renderTab() {
      const el = document.getElementById('hubTabContent');
      if (currentTab === 'overview') el.innerHTML = tplOverview();
      else if (currentTab === 'onboarding') el.innerHTML = tplOnboarding();
      else if (currentTab === 'inquiries') el.innerHTML = tplInquiries();
      else if (currentTab === 'tasks') el.innerHTML = tplTasks();
      else if (currentTab === 'assessors') el.innerHTML = tplAssessors();
      else if (currentTab === 'archive') el.innerHTML = tplArchive();
    }

    // ── Overview tab ───────────────────────────────────────────────────────
    function tplOverview() {
      const attentionItems = [
        ...onboarding.filter(r => needsAttention(r,'onb')).map(r => ({ type:'onb', id:r.id, label:`${r.name || 'Unnamed'} — ${r.programme || ''}`, sub: r.flagged ? 'Flagged for follow-up' : `No update in ${daysSince(r.updatedAt||r.createdAt)} days` })),
        ...inquiries.filter(r => needsAttention(r,'inq')).map(r => ({ type:'inq', id:r.id, label:`${r.name || 'Unnamed'} — enquiry`, sub: r.flagged ? 'Flagged for follow-up' : `No update in ${daysSince(r.updatedAt||r.createdAt)} days` })),
      ];
      const upcoming = tasks.filter(t => t.status !== 'done' && t.dueDate)
        .sort((a,b) => a.dueDate.localeCompare(b.dueDate)).slice(0, 8);
      return `
        <div class="field-row" style="align-items:start">
          <div class="card">
            <span class="section-label">Needs attention</span>
            ${attentionItems.length ? `<div class="attention-list">${attentionItems.map(i => `
              <div class="attention-row" data-action="open-${i.type}" data-id="${i.id}">
                <div><div style="font-weight:600">${esc(i.label)}</div><div style="font-size:0.78rem;color:var(--ink-light)">${esc(i.sub)}</div></div>
                <span style="color:#92400E">›</span>
              </div>`).join('')}</div>` : `<div class="empty-state">Nothing needs chasing right now.</div>`}
          </div>
          <div class="card">
            <span class="section-label">Upcoming tasks</span>
            ${upcoming.length ? `<div class="attention-list">${upcoming.map(t => `
              <div class="attention-row" style="border-color:var(--border)" data-action="open-task" data-id="${t.id}">
                <div><div style="font-weight:600">${esc(t.title)}</div><div style="font-size:0.78rem;color:var(--ink-light)">${esc(t.assignedTo || 'Unassigned')} · due ${fmtDate(t.dueDate)}</div></div>
                ${t.priority === 'high' ? '<span class="pill pill-red">High</span>' : ''}
              </div>`).join('')}</div>` : `<div class="empty-state">No open tasks with a due date.</div>`}
          </div>
        </div>`;
    }

    // ── Onboarding tab ─────────────────────────────────────────────────────
    function filteredOnboarding() {
      return onboarding.filter(r => r.statusBucket !== 'completed')
        .filter(r => onbFilter.programme === 'all' || r.programme === onbFilter.programme)
        .filter(r => onbFilter.status === 'all' || r.statusBucket === onbFilter.status || (onbFilter.status === 'attention' && needsAttention(r,'onb')))
        .filter(r => !onbFilter.q || (r.name||'').toLowerCase().includes(onbFilter.q) || (r.company||'').toLowerCase().includes(onbFilter.q))
        .sort((a,b) => (a.name||'').localeCompare(b.name||''));
    }
    function tplOnboarding() {
      const rows = filteredOnboarding();
      return `
        <div class="hub-toolbar">
          <div class="hub-filters">
            <button class="hub-filter-btn ${onbFilter.programme==='all'?'active':''}" data-action="onb-filter-prog" data-v="all">All programmes</button>

        description: document.getElementById('fTaskDesc').value.trim(),
        assignedTo: document.getElementById('fTaskAssigned').value,
        priority: document.getElementById('fTaskPriority').value,
        dueDate: document.getElementById('fTaskDue').value,
        linkType, linkId, linkName,
        updatedAt: Date.now(),
      };
      if (id) {
        await updateDoc(doc(db, 'hubTasks', id), payload);
      } else {
        payload.status = 'open'; payload.createdAt = Date.now();
        await addDoc(collection(db, 'hubTasks'), payload);
      }
      showToast('Saved'); closeTaskModal(); await loadAll();
    }
    async function toggleTask(id) {
      const t = tasks.find(x => x.id === id);
      const newStatus = t.status === 'done' ? 'open' : 'done';
      await updateDoc(doc(db, 'hubTasks', id), { status: newStatus, completedAt: newStatus === 'done' ? Date.now() : null });
      await loadAll();
    }
    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      await deleteDoc(doc(db, 'hubTasks', id));
      showToast('Deleted'); closeTaskModal(); await loadAll();
    }

    // ── Assessors tab ──────────────────────────────────────────────────────
    function tplAssessors() {
      return `
        <div class="card" style="max-width:520px">
          <span class="section-label">Assessors / team members</span>
          <p style="font-size:0.85rem;color:var(--ink-light);margin-bottom:1rem">People you can assign onboarding cases, enquiries and tasks to. Emily and Erica are always available as they have admin logins.</p>
          <div style="margin-bottom:1rem">${allAssessors().map(a => `<span class="assessor-chip">${esc(a)}${['Emily','Erica'].includes(a)?'':` <button data-action="remove-assessor" data-v="${esc(a)}">×</button>`}</span>`).join('')}</div>
          <div class="form-group" style="display:flex;gap:0.5rem;margin-bottom:0">
            <input id="fNewAssessor" placeholder="Add a name…" style="flex:1"/>
            <button class="btn btn-primary btn-sm" data-action="add-assessor">Add</button>
          </div>
        </div>`;
    }
    async function addAssessor() {
      const input = document.getElementById('fNewAssessor');
      const name = input.value.trim();
      if (!name) return;
      const names = Array.from(new Set([...assessorNames, name]));
      await setDoc(doc(db, 'hubSettings', 'assessors'), { names });
      showToast('Added'); await loadAll();
    }
    async function removeAssessor(name) {
      const names = assessorNames.filter(a => a !== name);
      await setDoc(doc(db, 'hubSettings', 'assessors'), { names });
      showToast('Removed'); await loadAll();
    }

    // ── Archive tab ────────────────────────────────────────────────────────
    function tplArchive() {
      const rows = onboarding.filter(r => r.statusBucket === 'completed').sort((a,b) => (b.completedAt||0)-(a.completedAt||0));
      return `
        <p style="font-size:0.85rem;color:var(--ink-light);margin-bottom:1rem">Students who've completed onboarding and moved to their ILP. Kept here for your records only.</p>
        ${rows.length ? `<div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>Name</th><th>Programme</th><th>Company</th><th>Completed</th><th></th></tr></thead><tbody>
          ${rows.map(r => `<tr>
            <td class="td-name">${esc(r.name)}</td><td>${esc(r.programme)}</td><td class="td-email">${esc(r.company||'—')}</td><td class="td-email">${fmtDate(r.completedAt)}</td>
            <td><button class="btn btn-outline btn-sm" data-action="open-onb" data-id="${r.id}">View</button></td>
          </tr>`).join('')}
        </tbody></table></div>` : `<div class="empty-state">No completed students yet.</div>`}`;
    }

    // ── Event delegation ──────────────────────────────────────────────────
    document.getElementById('hubTabContent').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action, id = el.dataset.id, v = el.dataset.v;
      if (action === 'new-onb') openOnbModal(null);
      else if (action === 'open-onb') openOnbModal(id);
      else if (action === 'open-inq') openInqModal(id);
      else if (action === 'open-task') openTaskModal(id);
      else if (action === 'onb-filter-prog') { onbFilter.programme = v; renderTab(); }
      else if (action === 'onb-filter-status') { onbFilter.status = v; renderTab(); }
      else if (action === 'new-inq') openInqModal(null);
      else if (action === 'inq-filter-status') { inqFilter.status = v; renderTab(); }
      else if (action === 'new-task') openTaskModal(null);
      else if (action === 'task-filter-status') { taskFilter.status = v; renderTab(); }
      else if (action === 'toggle-task') toggleTask(id);
      else if (action === 'add-assessor') addAssessor();
      else if (action === 'remove-assessor') removeAssessor(v);
    });
    document.getElementById('hubTabContent').addEventListener('input', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      if (el.dataset.action === 'onb-search' || el.dataset.action === 'inq-search') {
        const pos = el.selectionStart;
        if (el.dataset.action === 'onb-search') onbFilter.q = el.value.toLowerCase();
        else inqFilter.q = el.value.toLowerCase();
        renderTab();
        const fresh = document.querySelector('#hubTabContent .hub-search');
        if (fresh) { fresh.focus(); fresh.setSelectionRange(pos, pos); }
      }
    });
    document.getElementById('hubTabContent').addEventListener('change', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      if (el.dataset.action === 'task-filter-assessor') { taskFilter.assessor = el.value; renderTab(); }
    });

    // Onboarding modal delegation
    document.getElementById('onbModal').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action, id = el.dataset.id;
      if (action === 'close-onb') closeOnbModal();
      else if (action === 'save-onb') saveOnb(id || null);
      else if (action === 'add-onb-note') addOnbNote(id);
      else if (action === 'complete-onb') completeOnb(id);
      else if (action === 'delete-onb') deleteOnb(id);
    });
    document.getElementById('onbModal').addEventListener('change', (e) => {
      if (e.target.closest('[data-action="onb-programme-change"]')) {
        const checked = {};
        document.querySelectorAll('#onbChecklistGrid input[type=checkbox]').forEach(cb => checked[cb.dataset.key] = cb.checked);
        const programme = document.getElementById('fOnbProgramme').value;
        const items = getChecklist(programme);
        document.getElementById('onbChecklistGrid').innerHTML = items.map(i => `<label class="checklist-item ${checked[i.k]?'checked':''}" data-key="${i.k}">
          <input type="checkbox" data-key="${i.k}" ${checked[i.k]?'checked':''}/><span>${esc(i.l)}</span></label>`).join('');
        const showGdc = BDA_PROGRAMMES.includes(programme);
        document.getElementById('fOnbGdc').disabled = !showGdc;
        document.getElementById('fOnbGdcLabel').style.opacity = showGdc ? '1' : '0.4';
        document.getElementById('fOnbGdcLabel').textContent = 'GDC number ' + (showGdc ? '' : '(BDA only)');
      }
      const cb = e.target.closest('input[type=checkbox][data-key]');
      if (cb) cb.closest('.checklist-item').classList.toggle('checked', cb.checked);
    });

    // Inquiry modal delegation
    document.getElementById('inqModal').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action, id = el.dataset.id;
      if (action === 'close-inq') closeInqModal();
      else if (action === 'save-inq') saveInq(id || null);
      else if (action === 'add-inq-note') addInqNote(id);
      else if (action === 'convert-inq') convertInq(id);
      else if (action === 'delete-inq') deleteInq(id);
    });

    // Task modal delegation
    document.getElementById('taskModal').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action, id = el.dataset.id;
      if (action === 'close-task') closeTaskModal();
      else if (action === 'save-task') saveTask(id || null);
      else if (action === 'delete-task') deleteTask(id);
    });
  </script>
</body>
</html>
