    window.resendSignoffEmail = async (token, supervisorEmail, supervisorName) => {
      if (!supervisorEmail) { showToast('No email address on record for this supervisor.', 'error'); return; }
      try {
        if (typeof emailjs !== 'undefined') {
          await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
            to_email: supervisorEmail,
            to_name: supervisorName,
            subject: 'Reminder: session sign-off needed for ' + (learner.name || 'your learner'),
            learner_name: learner.name || '',
            learner_email: learner.email || '',
            learner_gdc: learner.gdc || '',
            submission_type: 'Session Sign-off Request (Resent)',
            file_url: 'logbook-signoff.html?t=' + token,
            submitted_at: new Date().toLocaleString('en-GB'),
            message: supervisorName + ',\n\nThis is a reminder that ' + (learner.name||'your learner') + ' has asked you to confirm the practical sessions you supervised on the Dental Nurse Training Oral Health Education Course.\n\nPlease click the link below to review and sign off:\n\n[replace with your OHE course domain]/logbook-signoff.html?t=' + token + '\n\nThank you,\nDental Nurse Training\nemily@dentalnurse.training',
          });
          showToast('Sign-off email resent to ' + supervisorEmail + ' ✅', 'success');
        } else {
          showToast('Email service not loaded. Please try again.', 'error');
        }
      } catch(e) {
        console.error(e);
        showToast('Could not resend email. Please try again.', 'error');
      }
    };

    window.submitPractical = async () => {
      const btn = document.getElementById('practicalSubmitBtn');
      btn.disabled = true; btn.textContent = 'Submitting...';
      try {
        // Save any unsaved draft fields first
        await savePracticalDrafts();

        const entries = learner.pcasEntries || [];
        // Group entries by unique supervisorGdc (each session may have a different supervisor)
        const supMap = {};
        for (const e of entries) {
          const gdc = e.supervisorGdc || '';
          if (!supMap[gdc]) supMap[gdc] = [];
          supMap[gdc].push(e);
        }
        const uniqueSupervisors = Object.keys(supMap);
        const tokenMap = {};

        for (const supervisorGdc of uniqueSupervisors) {
          const supEntries = supMap[supervisorGdc];
          const supervisorName  = supEntries[0].supervisorName  || '';
          const supervisorEmail = supEntries[0].supervisorEmail || '';
          const token = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,'0')).join('');
          tokenMap[supervisorGdc] = token;
          await setDoc(doc(db, 'logbookSignoffs', token), {
            token,
            learnerUid: uid,
            learnerName: learner.name || '',
            supervisorName,
            supervisorGdc,
            supervisorEmail,
            entries: supEntries,
            totalSupervisors: uniqueSupervisors.length,
            pending: true,
          });
          if (typeof emailjs !== 'undefined') {
            emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
              to_email: supervisorEmail,
              to_name: supervisorName,
              subject: 'Session sign-off needed for ' + (learner.name || 'your learner'),
              learner_name: learner.name,
              learner_email: learner.email || '',
              learner_gdc: learner.gdc || '',
              submission_type: 'Session Sign-off Request',
              file_url: 'logbook-signoff.html?t=' + token,
              submitted_at: new Date().toLocaleString('en-GB'),
              message: supervisorName + ',\n\n' + (learner.name||'Your learner') + ' has completed their practical portfolio on the Dental Nurse Training Oral Health Education Course and requires your confirmation that the sessions you supervised are accurate.\n\nPlease click the link below to review and sign off:\n\n[replace with your OHE course domain]/logbook-signoff.html?t=' + token + '\n\nThis should only take a few minutes. You will be asked to confirm that you were physically present for each session and that the details recorded are accurate.\n\nThank you,\nDental Nurse Training\nemily@dentalnurse.training',
            });
          }
        }

        const data = { practicalPendingSignoff: true, practicalSignoffSentAt: serverTimestamp(), practicalAmendmentRequested: false, logbookSignoffTokens: tokenMap };
        await setDoc(doc(db, 'learners', uid), data, { merge: true });
        learner.practicalPendingSignoff = true;
        renderSidebar(); showSection('practical');
        showToast('Portfolio submitted for sign-off! Your supervisors have been emailed. ✅', 'success');
      } catch(e) {
        console.error(e); showToast('Could not submit. Please try again.', 'error');
        btn.disabled = false; btn.textContent = 'Submit practical portfolio';
      }
    };

    function renderReflection(el) {
      const REFLECTION_GUIDANCE = `<div style="border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.25rem;overflow:hidden">
        <button onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none';this.querySelector('.rf-arrow').textContent=this.nextElementSibling.style.display===''?'▲':'▼'" style="width:100%;text-align:left;padding:0.85rem 1rem;background:var(--teal-pale);border:none;cursor:pointer;font-size:0.9rem;font-weight:600;color:var(--teal-dark);display:flex;justify-content:space-between;align-items:center">
          🪞 How to write your reflective account <span class="rf-arrow">▼</span>
        </button>
        <div style="display:none;padding:1.25rem;font-size:0.88rem;line-height:1.8;color:var(--ink-mid)">
          <p style="margin-bottom:0.75rem">This is your second reflective practice document - written at the end of the course, to compare against your "Reflection - Starting Out" from before you began seeing patients. It should be <strong>300-500 words</strong>. It is not a summary of the course content - it is a personal reflection on your learning experience and how it will change your practice.</p>
          <p style="margin-bottom:0.6rem"><strong>Use these headings to structure your response:</strong></p>
          <ol style="padding-left:1.25rem;margin:0">
            <li style="margin-bottom:0.85rem"><strong>Prior knowledge and starting point</strong><br/>Look back at your starting reflection - what has changed?</li>
            <li style="margin-bottom:0.85rem"><strong>Key learning points</strong><br/>What were the most significant things you learned? Focus on two or three specific points - for example, aspects of the GDC scope of practice, behaviour change technique, or diet and caries prevention - and explain why they were meaningful to you.</li>
            <li style="margin-bottom:0.85rem"><strong>Impact on clinical practice</strong><br/>How will this course change the way you work? Be specific. Reference GDC Standards for the Dental Team or DBOH guidance where relevant to demonstrate that your reflection is evidence-based.</li>
            <li style="margin-bottom:0.85rem"><strong>Challenges encountered</strong><br/>Were there any aspects of the course - theory, or your practical sessions - you found difficult or that raised questions for you? How did you address them?</li>
            <li style="margin-bottom:0"><strong>CPD development outcomes</strong><br/>This course contributes to GDC Development Outcomes A (Communication), C (Maintenance and development of knowledge and skill) and D (Patient safety and quality of care). Explain briefly how your learning maps to these outcomes.</li>
          </ol>
          <div style="margin-top:1rem;padding:0.75rem 1rem;background:#FFF8E7;border-radius:var(--radius);border-left:3px solid #D97706;font-size:0.85rem;color:#92400E">
            <strong>Important:</strong> Your reflective account must be your own work. Do not copy from course materials or other sources. Your assessor is looking for your personal voice and genuine reflection.
          </div>
        </div>
      </div>`;
      el.innerHTML = '<div class="dash-header"><h1>End-of-Course Reflective Account</h1><p>300-500 words reflecting on your learning throughout this course. This unlocks once your written tasks and practical portfolio have both been marked as passed.</p></div>'
        + (learner.reflectionPassed ? '<div class="submission-status status-submitted" style="background:#E8F7EE;color:#1A7F4B;border-color:rgba(26,127,75,0.2)"><span>✅</span> Reflective account passed! Well done.</div>' : learner.reflectionAmendmentRequested ? '<div class="submission-status" style="background:#FFF8E7;color:#92400E;border:1px solid rgba(245,158,11,0.4);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.25rem;display:flex;gap:0.75rem"><span style="font-size:1.25rem">✏</span><div><strong>Amendments requested</strong><p style="margin:0.3rem 0 0;font-size:0.9rem">Please read the feedback below, update your reflection, and resubmit.</p></div></div>' + (learner.reflectionFeedback ? `<div class="callout" style="margin-bottom:1.5rem;border-left-color:#D97706"><div class="callout-label" style="color:#92400E">Assessor feedback</div><p>${esc(learner.reflectionFeedback)}</p></div>` : '') : learner.reflectionSubmitted ? '<div class="submission-status status-submitted"><span>📬</span> Reflective account submitted - your assessor will review and provide feedback.</div>' : '')
        + '<div class="content-card">'
        + REFLECTION_GUIDANCE
        + (!learner.reflectionSubmitted ? '<div class="form-group"><label for="reflectionText">Your reflective account (300-500 words)</label><textarea id="reflectionText" style="width:100%;box-sizing:border-box;min-height:380px" placeholder="Write your reflective account here, or upload a document below...">' + (learner.reflectionDraft||'') + '</textarea></div><div class="upload-zone" id="reflectionUpload" onclick="document.getElementById(\'reflectionFile\').click()"><div class="uz-icon">📎</div><h4>Or upload as a document</h4><p>PDF or Word</p></div><input type="file" id="reflectionFile" accept=".pdf,.doc,.docx" style="display:none" onchange="uploadSubmission(\'reflection\', this)"/><div id="reflectionFileList" class="upload-file-list"></div><div style="display:flex;gap:0.75rem;margin-top:1rem;flex-wrap:wrap"><button class="btn btn-outline btn-sm" onclick="saveReflectionDraft()">Save draft</button><button class="btn btn-primary" id="reflectionSubmitBtn" onclick="submitWork(\'reflection\')">Submit reflective account</button></div>' : '<div style="background:var(--off-white);border-radius:var(--radius);padding:1.25rem">' + (learner.reflectionText||'Submitted via document upload.') + '</div>')
        + '</div>';
      setupUploadZone('reflectionUpload', 'reflectionFile');
    }

    const pendingFiles = {};
    function setupUploadZone(zoneId, inputId) {
      const zone = document.getElementById(zoneId);
      if (!zone) return;
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); const input = document.getElementById(inputId); if (input) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); } });
    }

    window.uploadSubmission = (type, input) => {
      const files = Array.from(input.files);
      if (!files.length) return;
      pendingFiles[type] = files;
      const listEl = document.getElementById(type+'FileList');
      if (listEl) listEl.innerHTML = files.map(f => '<div class="upload-file-item"><span class="ufi-name">📄 ' + f.name + '</span><span class="ufi-size">' + (f.size/1024/1024).toFixed(1) + ' MB</span></div>').join('');
      const btn = document.getElementById(type+'SubmitBtn');
      if (btn) btn.style.display = '';
    };

    window.submitWork = async (type) => {
      const btn = document.getElementById(type+'SubmitBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Uploading...'; }
      try {
        let fileUrl = null;
        const file = pendingFiles[type];
       const files = Array.isArray(pendingFiles[type]) ? pendingFiles[type] : (pendingFiles[type] ? [pendingFiles[type]] : []);
        const urls = [];
        for (const file of files) {
          const storageRef = ref(storage, 'submissions/' + uid + '/' + type + '/' + Date.now() + '_' + file.name);
          await uploadBytes(storageRef, file);
          const url = await getDownloadURL(storageRef);
          urls.push(url);
        }
        fileUrl = urls.join(', ');
        const text = type === 'reflection' ? document.getElementById('reflectionText')?.value : null;
        const updateData = {};
        updateData[type+'Submitted'] = true;
        updateData[type+'SubmittedAt'] = serverTimestamp();
        if (fileUrl) updateData[type+'FileUrl'] = fileUrl;
        if (text) updateData.reflectionText = text;
        await updateDoc(doc(db, 'learners', uid), updateData);
        learner[type+'Submitted'] = true;
        if (typeof emailjs !== 'undefined') {
          const typeLabels = { practical: 'Practical Portfolio', reflection: 'Final Reflection' };
          emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
            to_email: 'emily@dentalnurse.training',
            subject: (typeLabels[type] || type) + ' submitted - ' + (learner.name || 'Unknown'),
            learner_name: learner.name, learner_email: learner.email, learner_gdc: learner.gdc,
            submission_type: type, file_url: fileUrl || 'Text only', submitted_at: new Date().toLocaleString('en-GB')
          });
        }
        renderSidebar(); showSection(type);
        showToast('Submitted! Your assessor has been notified. ✅', 'success');
setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
      } catch(e) {
        console.error(e); showToast('Upload failed. Please try again.', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Try again'; }
      }
    };

    window.saveReflectionDraft = async () => {
